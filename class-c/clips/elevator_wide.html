</div>

<script>
(function () {
  "use strict";

  var qs    = new URLSearchParams(location.search);
  var start = parseInt(qs.get("start"), 10);
  var end   = parseInt(qs.get("end"),   10);
  var tick  = parseFloat(qs.get("tick"));

  if (!Number.isFinite(start) || start < 0 || start > 999) start = 560;
  if (!Number.isFinite(end)   || end   < 0 || end   > 999) end   = 1;
  if (!Number.isFinite(tick)  || tick <= 0)                tick  = 1.0733;

  var loop = qs.get("loop") !== "0";

  var W = 40, H = 62, T = 8, GAP = 14, CY = 137;

  function hSeg(x, y) {
    var h = T / 2;
    return [[x+h,y],[x+W-h,y],[x+W,y+h],[x+W-h,y+T],[x+h,y+T],[x,y+h]]
      .map(function (p) { return p.join(","); }).join(" ");
  }
  function vSeg(x, y) {
    var L = (H - T) / 2, h = T / 2;
    return [[x,y+h],[x+h,y],[x+T,y+h],[x+T,y+L-h],[x+h,y+L],[x,y+L-h]]
      .map(function (p) { return p.join(","); }).join(" ");
  }
  function segPoints(name, ox, oy) {
    var L = (H - T) / 2;
    switch (name) {
      case "a": return hSeg(ox,         oy);
      case "b": return vSeg(ox + W - T, oy);
      case "c": return vSeg(ox + W - T, oy + L);
      case "d": return hSeg(ox,         oy + H - T);
      case "e": return vSeg(ox,         oy + L);
      case "f": return vSeg(ox,         oy);
      case "g": return hSeg(ox,         oy + L - T / 2);
    }
  }

  var SEGS = ["a","b","c","d","e","f","g"];
  var GLYPH = {
    0:"abcdef", 1:"bc", 2:"abged", 3:"abgcd", 4:"fgbc",
    5:"afgcd", 6:"afgecd", 7:"abc", 8:"abcdefg", 9:"abfgcd"
  };

  var NS = "http://www.w3.org/2000/svg";
  var host = document.getElementById("digits");
  var totalW = 3 * W + 2 * GAP;
  var x0 = 350 - totalW / 2;   // still centered on the elevator panel
  var cells = [];

  for (var i = 0; i < 3; i++) {
    var ox = x0 + i * (W + GAP), cell = {};
    for (var s = 0; s < SEGS.length; s++) {
      var name = SEGS[s];
      var poly = document.createElementNS(NS, "polygon");
      poly.setAttribute("points", segPoints(name, ox, CY));
      poly.setAttribute("class", "seg");
      host.appendChild(poly);
      cell[name] = poly;
    }
    cells.push(cell);
  }

  function renderDigit(cell, digit) {
    var lit = digit === null ? "" : GLYPH[digit];
    for (var s = 0; s < SEGS.length; s++) {
      var name = SEGS[s];
      cell[name].classList.toggle("on", lit.indexOf(name) !== -1);
    }
  }
  function render(n) {
    var str = String(n), pad = 3 - str.length;
    for (var i = 0; i < 3; i++) {
      if (i < pad) renderDigit(cells[i], null);
      else         renderDigit(cells[i], Number(str[i - pad]));
    }
  }

  var step   = start >= end ? -1 : 1;
  var steps  = Math.abs(start - end);
  var period = tick * 1000;
  var t0 = performance.now();
  var last = null;

  var arrow = document.getElementById("arrowDown");
  if (step > 0) arrow.setAttribute("points", "252,176 274,176 263,148");

  function frame(now) {
    var k = Math.floor((now - t0) / period);
    if (k > steps) {
      if (loop) { t0 = now; k = 0; }
      else      { k = steps; }
    }
    var value = start + step * k;
    if (value !== last) { render(value); last = value; }
    if (loop || k < steps) requestAnimationFrame(frame);
  }

  render(start);
  requestAnimationFrame(frame);
})();
</script>
