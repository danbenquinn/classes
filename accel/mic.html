<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Microphone</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e2e2de; --accent: #1f6feb; --ok: #1a7f37; --rec: #cf222e; --warn: #9a6700; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111213; --fg: #ececec; --muted: #9a9a9a; --line: #2a2b2d; --accent: #4c8dff; --ok: #3fb950; --rec: #ff6b6b; --warn: #d29922; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px; -webkit-user-select: none; user-select: none; }
  main { width: 100%; max-width: 360px; text-align: center; }
  .dot { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 26px; background: var(--line); }
  .dot.ok { background: var(--ok); } .dot.rec { background: var(--rec); } .dot.warn { background: var(--warn); }
  .dot.wait { background: transparent; border: 6px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 10px; }
  p { margin: 0; color: var(--muted); }
  .meter { height: 14px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 22px 0 0; }
  .meter div { height: 100%; width: 0; background: var(--ok); }
  button { margin-top: 30px; width: 100%; padding: 18px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font: 600 18px/1 inherit; font-family: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="dot" class="dot"></div>
  <h1 id="title">Microphone</h1>
  <p id="sub">Tap below to connect this phone to the deck.</p>
  <div class="meter" id="meter" hidden><div id="bar"></div></div>
  <button id="go">Tap to connect</button>
</main>
<script src="common.js"></script>
<script>
// The microphone as a live-capture instrument (Workshop 6, 2026-11-20). Same room protocol as phone.html
// (hello / claim / start / data / done / release), so live-capture.js drives it unchanged in shape: on
// "start" with src "mic" it keeps exactly `seconds` of raw microphone (echo cancellation, noise suppression
// and auto-gain off), then sends it in batches of 2000 samples and says "done". Time in ms, signal in the
// microphone's own units (the deck normalizes it).
const params = new URLSearchParams(location.search), ROOM = (params.get("room") || "").toUpperCase(), SIM = params.has("sim");
const me = { id: "m-" + randomId(), role: "phone" };
const $ = (id) => document.getElementById(id);
let conn = null, state = "start", ctx = null, node = null, sr = 48000, run = null;
function show(dot, title, sub, btn) { $("dot").className = "dot " + dot; $("title").textContent = title; $("sub").textContent = sub;
  $("go").hidden = !btn; if (btn) $("go").textContent = btn; }
if (!ROOM) show("warn", "No deck code", "Scan the QR code on your group's laptop to open this page.");

const WORKLET = `
class Grab extends AudioWorkletProcessor {
  constructor() { super(); this.buf = null; this.k = 0; this.pk = 0; this.last = 0;
    this.port.onmessage = (e) => { this.buf = new Float32Array(e.data.n); this.k = 0; }; }
  process(inputs) { const x = inputs[0] && inputs[0][0]; if (!x) return true;
    for (let i = 0; i < x.length; i++) { const a = Math.abs(x[i]); if (a > this.pk) this.pk = a;
      if (this.buf) { this.buf[this.k++] = x[i]; if (this.k === this.buf.length) { this.port.postMessage({ type: "clip", buf: this.buf }, [this.buf.buffer]); this.buf = null; } } }
    if (currentFrame - this.last > sampleRate / 20) { this.port.postMessage({ type: "level", pk: this.pk }); this.pk = 0; this.last = currentFrame; }
    return true; } }
registerProcessor("grab", Grab);`;

async function startMic() {
  ctx = new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume(); sr = ctx.sampleRate;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })));
  node = new AudioWorkletNode(ctx, "grab");
  let src;
  if (SIM) {   // a 700 Hz note with overtones, for testing on one laptop
    const o = ctx.createOscillator(), o3 = ctx.createOscillator(), g3 = ctx.createGain(); o.frequency.value = 700; o3.frequency.value = 2100; g3.gain.value = 0.25;
    src = ctx.createGain(); src.gain.value = 0.4; o.connect(src); o3.connect(g3); g3.connect(src); o.start(); o3.start();
  } else {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
    src = ctx.createMediaStreamSource(stream);
  }
  const mute = ctx.createGain(); mute.gain.value = 0; src.connect(node); node.connect(mute); mute.connect(ctx.destination);
  node.port.onmessage = onWorklet;
  try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch {}
}
function onWorklet(e) {
  const m = e.data;
  if (m.type === "level") {
    const p = Math.max(0, Math.min(100, 100 * Math.log(Math.max(m.pk, 0.003) / 0.003) / Math.log(1 / 0.003)));
    $("bar").style.width = p + "%"; $("bar").style.background = m.pk > 0.98 ? "var(--rec)" : "var(--ok)";
  } else if (m.type === "clip" && run) sendClip(m.buf, run);
}
async function sendClip(buf, r) {
  const N = 2000, batches = Math.ceil(buf.length / N);
  for (let b = 0; b < batches; b++) {
    const t = [], a = [];
    for (let i = b * N; i < Math.min(buf.length, (b + 1) * N); i++) { t.push(+(i / sr * 1000).toFixed(4)); a.push(Math.round(buf[i] * 1e4) / 1e4); }
    conn.send({ type: "data", phone: me.id, run: r, seq: b, t, a });
    await new Promise((res) => setTimeout(res, 120));     // supabase-js throttles bursts; space the batches
  }
  conn.send({ type: "done", phone: me.id, run: r, n: buf.length, batches });
  run = null; connected();
}

$("go").onclick = async () => {
  if (state !== "start" || !ROOM) return;
  state = "connecting"; show("wait", "Connecting…", "Finding your deck.");
  try { await startMic(); }
  catch (e) { state = "start"; show("warn", "Microphone needed", "Allow microphone access when asked, in Safari or Chrome. (" + (e.message || e) + ")", "Try again"); return; }
  $("meter").hidden = false;
  try { conn = await openRoom(ROOM, me, { onMessage, onPeers: () => {} }); }
  catch (e) { state = "start"; show("warn", "Couldn't connect", e.message, "Try again"); return; }
  conn.send({ type: "hello", phone: me.id });
  setTimeout(() => { if (state === "connecting") show("wait", "Waiting for the deck…", "Make sure the deck's capture step is open."); }, 4000);
};
function onMessage(m) {
  if (!conn || state === "released") return;
  if (m.type === "whois") { if (state === "connecting") conn.send({ type: "hello", phone: me.id }); }
  else if (m.type === "claim") { if (m.phone === me.id) { if (!run) connected(); } else if (state === "connecting") busy(); }
  else if (m.type === "busy" && m.phone === me.id) busy();
  else if (m.phone !== me.id) return;
  else if (m.type === "start") {
    run = m.run; state = "rec"; show("rec", "Recording", "A quarter of a second, starting now.");
    node.port.postMessage({ n: Math.round((+m.seconds || 0.25) * sr) });
  } else if (m.type === "release") { state = "released"; show("", "Done", "All recordings are in. You can close this page."); }
}
function connected() { state = "connected"; show("ok", "Connected", "Point the microphone at the whistle. The laptop's Record button takes a quarter second."); }
function busy() { state = "released"; show("warn", "Deck is busy", "Another phone is already connected to this deck."); }
</script>
</body>
</html>
