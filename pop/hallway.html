<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hallway Ping Timer</title>
<style>
  :root {
    --bg: #f7f7f5; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e2e2de; --card: #ffffff;
    --accent: #1f6feb; --ok: #1a7f37; --rec: #cf222e; --warn: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111213; --fg: #ececec; --muted: #9a9a9a; --line: #2a2b2d; --card: #1a1b1d;
      --accent: #4c8dff; --ok: #3fb950; --rec: #ff6b6b; --warn: #d29922; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(10px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom)); -webkit-user-select: none; user-select: none; }
  main { max-width: 460px; margin: 0 auto; }
  button { font: 600 15px/1 inherit; font-family: inherit; border-radius: 10px; padding: 10px 12px; border: 0; background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
  button.small { padding: 6px 10px; font-size: 13px; }
  button.listening { background: var(--rec); }
  button:disabled { opacity: .4; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .dist { display: flex; align-items: center; gap: 8px; font: 700 24px ui-monospace, "SF Mono", Menlo, monospace; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  /* the meter and the trigger share ONE track, so the knob sits exactly under the red line */
  .lv { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 6px; align-items: center; }
  .lv .lab { font-size: 13px; color: var(--muted); }
  .track { position: relative; height: 22px; }
  .meter { position: absolute; inset: 0; background: var(--line); border-radius: 6px; overflow: hidden; }
  .meter .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ok); }
  .meter .hold { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg); opacity: .45; left: 0; }
  .redline { position: absolute; top: -3px; bottom: -3px; width: 3px; margin-left: -1.5px; background: var(--rec); left: 0; border-radius: 2px; }
  .slider { position: relative; height: 26px; touch-action: none; cursor: pointer; }
  .slider .rail { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--line); }
  .slider .knob { position: absolute; top: 2px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: var(--rec);
    box-shadow: 0 1px 3px rgba(0,0,0,.35); left: 0; }
  .trial h3 { margin: 0; font-size: 15px; }
  .watch { font: 600 15px ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; color: var(--muted); }
  .watch.on { color: var(--fg); }
  .ping { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
  .ping .name { font-weight: 600; font-size: 15px; }
  .ping .heard { font: 15px ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .msg { font-size: 14px; min-height: 1.2em; margin-top: 8px; }
  .msg.warn { color: var(--rec); } .msg.ok { color: var(--ok); }
  .dists { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
  .dists button { font-size: 18px; padding: 16px 0; }
  .ver { margin-top: 10px; font-size: 11px; color: var(--muted); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="pick">
    <h2 style="margin:6px 0 4px">Hallway Ping Timer</h2>
    <p style="color:var(--muted);margin:0">How far will this phone be from the test ping?</p>
    <div class="dists" id="dists"></div>
  </section>

  <section id="app" hidden>
    <div class="row">
      <button id="submit">Submit trials</button>
      <div class="dist"><span id="distLbl"></span><button class="ghost small" id="change">change</button></div>
    </div>
    <div class="msg" id="msg"></div>

    <div class="card lv">
      <span></span>
      <div class="track"><div class="meter"><div class="bar" id="bar"></div><div class="hold" id="hold"></div></div><div class="redline" id="redline"></div></div>
      <span class="lab">Trigger</span>
      <div class="slider" id="slider" role="slider" aria-label="Trigger"><div class="rail"></div><div class="knob" id="knob"></div></div>
    </div>

    <div id="trials"></div>
    <div class="ver" id="ver"></div>
  </section>
</main>

<script>
// ─────────────────────────────────────────────────────────────
// Hallway Ping Timer · Workshop 6, Part 3. v2, 2026-11-23 (Daniel's redesign).
//
// Each phone picks its distance from the TEST ping (0, 8, 16, 24, 32 m). Three trials, stacked. Each trial has two
// pings, each with its own Start listening button (red "Stop listening" while it listens):
//   SYNC ping  heard at 00:00.000 by definition; it starts the trial's stopwatch
//   TEST ping  heard at the stopwatch's reading, to the millisecond; it stops the stopwatch
// The phone syncs itself, so what it submits per trial is one number: sync → test, in seconds.
// A row listens for ONE ping and stops by itself when it hears it. "Delete data" starts that trial over.
//
// Timing is on the phone's own audio clock, to the sample. THE SLIP CHECK (Nov 18: some phones' live audio graph
// slips whole 40 ms chunks): from the sync row's Start listening until the test ping, the microphone is ALSO recorded
// (MediaRecorder). When the test ping is in, the recording is decoded and its two pings found; if its gap differs from
// the live gap by more than 10 ms, the recording's gap is used. Nothing shows on screen; the submission records it.
//
// SUBMIT needs both pings in all three trials, then saves one row per phone (`save_class_run`, workshop
// "W6-hallway-<d>m": trials [{trial, t1:0, t2:gap, …}]). The instructor key comes from the link (#k=…), else is asked once.
// URL test switches: ?sim=1 (fake microphone: pings at 3/9, 23/29, 43/49 s; the test pings late by d/343.9 s),
// &slip=s (the live timer gains 40 ms at s seconds), &dry=1 (Submit doesn't send).
// ─────────────────────────────────────────────────────────────
const VERSION = "v2 · Nov 23";
const DISTS = [0, 8, 16, 24, 32];
const AGREE_S = 0.010, PRE_MS = 10, POST_MS = 40;
const SUPA = "https://rdbacwwbeyeqdkswwvjt.supabase.co", SUPA_KEY = "sb_publishable_IQNxMMynit0aWtOS3tjiRQ_h5sNo159";
const params = new URLSearchParams(location.search), SIM = params.has("sim"), SLIP = +(params.get("slip") || 0);
const $ = (id) => document.getElementById(id);
let dist = null, ctx = null, node = null, sr = 48000, stream = null;
let listen = null;              // {trial, which:"sync"|"test"} while a row listens
const T = [1, 2, 3].map((n) => ({ n, sync: null, test: null, rec: null, check: null, delArm: 0 }));   // sync/test = {t (audio s), perf}
let thr = 0.25;
try { const v = +localStorage.getItem("hall-thr"); if (v > 0) thr = v; } catch {}
const keyFromHash = new URLSearchParams(location.hash.slice(1)).get("k");
if (keyFromHash) try { localStorage.setItem("hall-key", keyFromHash); } catch {}
$("ver").textContent = VERSION;

// ── distance ────────────────────────────────────────────────
$("dists").innerHTML = DISTS.map((d) => `<button data-d="${d}">${d} m</button>`).join("");
$("dists").querySelectorAll("button").forEach((b) => b.onclick = () => { dist = +b.dataset.d; $("pick").hidden = true; $("app").hidden = false; $("distLbl").textContent = dist + " m"; });
$("change").onclick = () => { $("pick").hidden = false; $("app").hidden = true; };

// ── formats ─────────────────────────────────────────────────
const two = (x) => String(x).padStart(2, "0");
const hund = (s) => { const cs = Math.floor(s * 100 + 1e-6); return `${two(Math.floor(cs / 6000))}:${two(Math.floor(cs / 100) % 60)}:${two(cs % 100)}`; };   // stopwatch, hundredths
const msec = (s) => { const ms = Math.round(s * 1000); return `${two(Math.floor(ms / 60000))}:${two(Math.floor(ms / 1000) % 60)}.${String(ms % 1000).padStart(3, "0")}`; };   // a ping, milliseconds

// ── meter + trigger: one track, one mapping (log scale, 0.003 → 0 %, 1.0 → 100 %) ─
const pct = (v) => Math.max(0, Math.min(100, 100 * Math.log(Math.max(v, 0.003) / 0.003) / Math.log(1 / 0.003)));
const fromPct = (p) => 0.003 * Math.pow(1 / 0.003, p / 100);
function showThr() { const p = pct(thr) + "%"; $("redline").style.left = p; $("knob").style.left = p; }
showThr();
(function sliderDrag() {
  const el = $("slider");
  const at = (e) => { const r = el.getBoundingClientRect(); const p = Math.max(1, Math.min(100, (e.clientX - r.left) / r.width * 100));
    thr = fromPct(p); showThr(); node && node.port.postMessage({ thr }); try { localStorage.setItem("hall-thr", thr); } catch {} };
  el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); at(e); });
  el.addEventListener("pointermove", (e) => { if (el.hasPointerCapture(e.pointerId)) at(e); });
})();

// ── detector (audio thread) ─────────────────────────────────
const WORKLET = `
class Pinger extends AudioWorkletProcessor {
  constructor(o) { super(); const p = o.processorOptions;
    this.thr = p.thr; this.pre = Math.round(p.pre * sampleRate); this.post = Math.round(p.post * sampleRate);
    this.ring = new Float32Array(this.pre); this.ri = 0; this.cap = null; this.pk = 0; this.last = 0; this.on = false;
    this.shift = 0; this.slipAt = p.slipAt || 0;
    this.port.onmessage = (e) => { if (e.data.thr) this.thr = e.data.thr; if ("on" in e.data) { this.on = e.data.on; if (!this.on) this.cap = null; } }; }
  process(inputs) {
    const x = inputs[0] && inputs[0][0]; if (!x) return true;
    for (let i = 0; i < x.length; i++) {
      if (this.slipAt && currentFrame + i >= this.slipAt * sampleRate) { this.shift += Math.round(0.04 * sampleRate); this.slipAt = 0; }
      const v = x[i], a = v < 0 ? -v : v, f = currentFrame + i + this.shift;
      if (a > this.pk) this.pk = a;
      if (this.cap) { this.cap.buf[this.cap.n++] = v;
        if (this.cap.n === this.cap.buf.length) { this.port.postMessage({ type: "ping", trig: this.cap.trig, start: this.cap.start, buf: this.cap.buf }, [this.cap.buf.buffer]); this.cap = null; } }
      else if (this.on && a >= this.thr) {
        const buf = new Float32Array(this.pre + this.post);
        for (let k = 0; k < this.pre; k++) buf[k] = this.ring[(this.ri + k) % this.pre];
        this.cap = { buf, n: this.pre, trig: f, start: f - this.pre }; this.cap.buf[this.cap.n++] = v; this.on = false; }   // ONE ping per listen
      this.ring[this.ri] = v; this.ri = (this.ri + 1) % this.pre;
    }
    if (currentFrame - this.last > sampleRate / 20) { this.port.postMessage({ type: "level", pk: this.pk }); this.pk = 0; this.last = currentFrame; }
    return true;
  }
}
registerProcessor("pinger", Pinger);`;

function refineOnset(buf, pre, rate) {
  let ss = 0; for (let k = 0; k < pre; k++) ss += buf[k] * buf[k];
  const noise = Math.sqrt(ss / pre), early = Math.round(0.003 * rate);
  let pk = 0; for (let k = pre; k < Math.min(buf.length, pre + early); k++) pk = Math.max(pk, Math.abs(buf[k]));
  const lvl = Math.max(6 * noise, 0.2 * pk);
  for (let k = Math.max(0, pre - Math.round(0.005 * rate)); k <= pre; k++) if (Math.abs(buf[k]) >= lvl) return k;
  return pre;
}
async function ensureAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
  await ctx.resume(); sr = ctx.sampleRate;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })));
  node = new AudioWorkletNode(ctx, "pinger", { processorOptions: { thr, pre: PRE_MS / 1000, post: POST_MS / 1000, slipAt: SLIP } });
  let src;
  if (SIM) { src = simSource(); const d = ctx.createMediaStreamDestination(); src.connect(d); stream = d.stream; }
  else { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
    src = ctx.createMediaStreamSource(stream); }
  const mute = ctx.createGain(); mute.gain.value = 0; src.connect(node); node.connect(mute); mute.connect(ctx.destination);
  node.port.onmessage = onWorklet;
  try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch {}
}
function simSource() {
  const n = Math.round(60 * sr), b = ctx.createBuffer(1, n, sr), x = b.getChannelData(0);
  for (let i = 0; i < n; i++) x[i] = (Math.random() - 0.5) * 0.01;
  const ping = (t0, amp) => { const i0 = Math.round(t0 * sr);
    for (let k = 0; k < 0.06 * sr && i0 + k < n; k++) x[i0 + k] += amp * Math.sin(2 * Math.PI * 2400 * k / sr) * Math.exp(-k / (0.01 * sr)); };
  const late = (dist || 0) / 343.9;
  for (const t of [3, 23, 43]) { ping(t, 0.9); ping(t + 6 + late, 0.9 / (1 + (dist || 0) / 8)); }
  const s = ctx.createBufferSource(); s.buffer = b; s.start(ctx.currentTime + 0.05); return s;
}

let holdPk = 0, holdAt = 0;
function onWorklet(e) {
  const m = e.data;
  if (m.type === "level") {
    const now = performance.now(); if (m.pk > holdPk || now - holdAt > 1500) { holdPk = m.pk; holdAt = now; }
    $("bar").style.width = pct(m.pk) + "%"; $("bar").style.background = m.pk >= thr ? "var(--rec)" : "var(--ok)";
    $("hold").style.left = pct(holdPk) + "%";
  } else if (m.type === "ping" && listen) {
    const tr = T[listen.trial - 1], pre = m.trig - m.start, t = (m.start + refineOnset(m.buf, pre, sr)) / sr;
    const hit = { t, perf: performance.now() };
    if (listen.which === "sync") tr.sync = hit; else { tr.test = hit; finishRecording(tr); }
    listen = null; render(); say("");
  }
}

// ── listening, one row at a time ────────────────────────────
async function startListening(n, which) {
  try { await ensureAudio(); }
  catch (e) { say("Couldn't start the microphone: " + (e.message || e) + ". Allow microphone access; use Safari or Chrome.", "warn"); return; }
  if (listen) stopListening(false);
  listen = { trial: n, which }; node.port.postMessage({ on: true, thr });
  if (which === "sync") startRecording(T[n - 1]);
  render();
}
function stopListening(rerender = true) {
  if (!listen) return;
  const tr = T[listen.trial - 1];
  if (listen.which === "sync" && !tr.sync) dropRecording(tr);      // nothing heard: that recording is for nothing
  node && node.port.postMessage({ on: false }); listen = null; if (rerender) render();
}

// ── the hidden recording (slip check) ───────────────────────
function pickMime() { for (const m of ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"]) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m; return ""; }
function startRecording(tr) {
  dropRecording(tr); if (!window.MediaRecorder || !stream) return;
  try { const mime = pickMime(), chunks = [];
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 64000 } : undefined);
    mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    tr.rec = { mr, chunks, mime: mr.mimeType || mime, done: new Promise((res) => { mr.onstop = res; }) }; mr.start();
  } catch { tr.rec = null; }
}
function dropRecording(tr) { if (tr.rec) { try { tr.rec.mr.onstop = null; tr.rec.mr.stop(); } catch {} } tr.rec = null; }
function finishRecording(tr) {
  const r = tr.rec; tr.rec = null; if (!r) { tr.check = Promise.resolve({ check: "no recording" }); return; }
  tr.check = new Promise((res) => setTimeout(async () => {          // a little past the test ping, so it's in the file
    try { r.mr.stop(); await r.done;
      const buf = await ctx.decodeAudioData(await new Blob(r.chunks, { type: r.mime }).arrayBuffer());
      res(compare(tr, findPops(buf.getChannelData(0), buf.sampleRate)));
    } catch (e) { res({ check: "recording unusable" }); }
  }, 400));
  // a slip the recording caught: the SCREEN shows the corrected time too, not only the submission
  const mine = tr.check; tr.check.then((c) => { if (tr.check === mine && c.check === "live slipped") { tr.fix = c.rec_gap; render(); } });
}
function findPops(x, rate) {
  const step = Math.max(1, Math.floor(x.length / 20000)), s = [];
  for (let i = 0; i < x.length; i += step) s.push(Math.abs(x[i]));
  s.sort((a, b) => a - b);
  const noise = s[Math.floor(s.length / 2)] || 1e-6; let mx = 0; for (let i = 0; i < x.length; i++) mx = Math.max(mx, Math.abs(x[i]));
  const th = Math.max(0.05 * mx, 25 * noise), pre = Math.round(PRE_MS / 1000 * rate), post = Math.round(POST_MS / 1000 * rate), hold = Math.round(1.0 * rate);
  const out = [];
  for (let i = pre; i < x.length - post; i++) { if (Math.abs(x[i]) < th) continue; out.push((i - pre + refineOnset(x.slice(i - pre, i + post), pre, rate)) / rate); i += hold; }
  return out;
}
function compare(tr, pops) {
  // the recording starts a moment before the sync row listened: its sync ping is the first pop; its test ping is the
  // pop nearest (first + live gap). A wrong pick would have to sit within 0.1 s of the right one.
  const lg = tr.test.t - tr.sync.t;
  if (pops.length < 2) return { check: "recording unusable" };
  let best = null;
  for (const a of pops) for (const b of pops) if (b > a) { const d = Math.abs(b - a - lg); if (d < 0.1 && (!best || d < best.d)) best = { d, rg: b - a }; }
  if (!best) return { check: "not found in recording" };
  return Math.abs(best.rg - lg) < AGREE_S ? { check: "agrees", rec_gap: +best.rg.toFixed(5) }
    : { check: "live slipped", rec_gap: +best.rg.toFixed(5), slip_ms: +((lg - best.rg) * 1000).toFixed(1) };
}

// ── the three trials ────────────────────────────────────────
function render() {
  $("trials").innerHTML = T.map((tr) => {
    const L = (w) => listen && listen.trial === tr.n && listen.which === w;
    const btn = (w, ok) => `<button class="small ${L(w) ? "listening" : ""}" data-act="${L(w) ? "stop" : "start"}" data-n="${tr.n}" data-w="${w}" ${ok ? "" : "disabled"}>${L(w) ? "Stop listening" : "Start listening"}</button>`;
    const gap = tr.test ? (tr.fix != null ? tr.fix : tr.test.t - tr.sync.t) : null;
    const watch = gap != null ? hund(gap) : "00:00:00";
    return `<div class="card trial">
      <div class="row"><h3>Trial ${tr.n}</h3><span class="watch ${tr.sync && !tr.test ? "on" : ""}" id="w${tr.n}">⏱ ${watch}</span>
        <button class="ghost small" data-act="del" data-n="${tr.n}" ${tr.sync || L("sync") ? "" : "disabled"}>${tr.delArm && Date.now() - tr.delArm < 3000 ? "Tap again" : "Delete data"}</button></div>
      <div class="ping"><span class="name">Sync ping</span>${tr.sync ? `<span class="heard">heard at 00:00.000</span>` : btn("sync", true)}</div>
      <div class="ping"><span class="name">Test ping</span>${tr.test ? `<span class="heard">heard at ${msec(gap)}</span>` : btn("test", !!tr.sync)}</div>
    </div>`;
  }).join("");
}
$("trials").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const n = +b.dataset.n, tr = T[n - 1];
  if (b.dataset.act === "start") startListening(n, b.dataset.w);
  else if (b.dataset.act === "stop") stopListening();
  else if (b.dataset.act === "del") {
    if (!tr.delArm || Date.now() - tr.delArm > 3000) { tr.delArm = Date.now(); render(); setTimeout(render, 3100); return; }
    if (listen && listen.trial === n) stopListening(false);
    dropRecording(tr); tr.sync = tr.test = tr.check = tr.fix = null; tr.delArm = 0; render();
  }
});
// a running stopwatch: from the sync ping, on the phone's clock, until the test ping
(function tick() {
  for (const tr of T) if (tr.sync && !tr.test) { const el = $("w" + tr.n); if (el) el.textContent = "⏱ " + hund((performance.now() - tr.sync.perf) / 1000); }
  requestAnimationFrame(tick);
})();
function say(t, cls) { $("msg").textContent = t; $("msg").className = "msg " + (cls || ""); }

// ── submit ──────────────────────────────────────────────────
function getKey() {
  try { const k = localStorage.getItem("hall-key"); if (k) return k; } catch {}
  const k = prompt("Instructor key (asked once on this phone)"); if (k) try { localStorage.setItem("hall-key", k.trim()); } catch {}
  return k && k.trim();
}
$("submit").onclick = async () => {
  if (dist == null) return;
  const missing = T.filter((tr) => !tr.sync || !tr.test).map((tr) => tr.n);
  if (missing.length) { say(`Trial${missing.length > 1 ? "s" : ""} ${missing.join(" and ")} ${missing.length > 1 ? "need" : "needs"} both pings before you can submit.`, "warn"); return; }
  if (listen) stopListening();
  $("submit").disabled = true; say("Checking…");
  const trials = [];
  for (const tr of T) {
    const c = await (tr.check || Promise.resolve({ check: "no recording" }));
    const live = tr.test.t - tr.sync.t, gap = c.check === "live slipped" ? c.rec_gap : live;
    trials.push(Object.assign({ trial: tr.n, t1: 0, t2: +gap.toFixed(5), gap_live: +live.toFixed(5) }, c));
  }
  const run = { distance: dist, trials, sr, version: VERSION, ua: navigator.userAgent.slice(0, 160), submitted: new Date().toISOString() };
  if (params.has("dry")) { window.__lastRun = run; say("Dry run, not sent: " + trials.map((t) => t.check).join(", "), "ok"); $("submit").disabled = false; return; }
  const key = getKey(); if (!key) { say("Submit needs the instructor key.", "warn"); $("submit").disabled = false; return; }
  say("Sending…");
  try {
    const r = await fetch(SUPA + "/rest/v1/rpc/save_class_run", { method: "POST", headers: { "Content-Type": "application/json", apikey: SUPA_KEY },
      body: JSON.stringify({ p_key: key, p_workshop: "W6-hallway-" + dist + "m", p_run: run }) });
    if (!r.ok) { const t = await r.text(); if (/instructor key/.test(t)) try { localStorage.removeItem("hall-key"); } catch {}
      throw new Error(/instructor key/.test(t) ? "wrong instructor key" : "HTTP " + r.status); }
    T.forEach((tr) => { dropRecording(tr); tr.sync = tr.test = tr.check = tr.fix = null; }); render();
    say(`Submitted: ${dist} m, three trials. This phone is cleared.`, "ok");
  } catch (e) { say("Didn't send (" + e.message + "). Your trials are still here; try again.", "warn"); }
  $("submit").disabled = false;
};
render();
</script>
</body>
