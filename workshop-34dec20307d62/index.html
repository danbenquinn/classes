  { id:"s2-close",
    top:"html",
    html:"<div class='bigeq'><span class='kicker'>Why so close a race?</span>$v_t\\propto\\sqrt{\\dfrac{m}{C_dA_\\perp}}$</div>",
    lead:"<p>The masses of the spheres you used today range over a factor of about 230, from 2.7 g to 624 g, and their frontal areas over a factor of about 140. But the two grow together, because bigger spheres are heavier, so mass per frontal area stays within about one order of magnitude: 0.2 to 3.6 g/cm². Terminal speed goes as the <i>square root</i> of that, which squeezes it down to a factor of four, 9 to 35 m/s.</p><p>If you really want to change how fast something falls, change its <b>shape</b>. $C_d$ runs from about 0.04 for a streamlined body to about 1.4 for an open cup facing the wind. Enter the <b>coffee filter</b>.</p>" },

    lead:"<p>Here is a real flight of a weather balloon, launched from the NWS site at Sterling, Virginia, outside DC, on the afternoon of October 7, 2026. Ham-radio volunteers recorded its GPS altitude about once a second as it flew. Above is the radiosonde's altitude $y(t)$. The clock starts at $t=0$, the moment the balloon burst at 29.9 km; before that it was climbing.</p><p>Pick <b>Slope</b> in the toolbar and drag across the fall between <b>25 km and 23 km</b> — the soft gridlines are every kilometer. Report the slope of the best-fit line to the nearest whole m/s.</p><p class=\"aside\">Radiosonde telemetry: SondeHub contributors, CC BY-SA 2.0.</p>",
