    html:"<div class='bigeq'><span class='kicker'>One model for all five</span>$\\displaystyle x(t)=e^{-\\zeta\\omega t}\\big[c_1\\sin+c_2\\cos\\big]\\!\\left(\\omega\\sqrt{1-\\zeta^2}\\,t\\right)$</div>",
    lead:"<p>This is the solution for a damped spring, the general solution for a function $x(t)$ that satisfies $m\\ddot{x}+\\alpha\\dot{x}+kx=0$. Two terms to focus on: $\\omega \\sqrt{1-\\zeta^2}$ sets how fast the system <b>rings</b>, and $\\zeta \\omega$ sets how fast the ringing <b>dies</b>.</p>",
    check:"Warmup: suppose two bells ring at the same frequency. One has $\\zeta=0.01$, the other $\\zeta=0.1$. Which one will be ringing louder after five seconds?",
    choices:["The one with $\\zeta=0.1$, because more damping means a longer, slower response", "The one with $\\zeta=0.01$: its envelope $e^{-\\zeta\\omega t}$ shrinks ten times more slowly", "Both, equally, because they ring at the same frequency", "Neither: damping stops any spring within a few swings"],
    answer:1,
    feedback:"Right. $\\zeta$ sits in the exponent next to $\\omega$, so at the same $\\omega$ a tenth of the damping ratio buys ten times as long a ring.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Find $\\zeta$ in the model above. Which part of the curve does it control: how fast it wiggles, or how fast the wiggles shrink?"} },

  { id:"c-capture",
    gate:"data",
    requireAxis:"z",
    slots:["main", "short"],
    live:{ slots:["main", "short"] },
    matchX:true,
    lead:"<p><b>Part 1: A cantilever</b>.</p><ol><li>Scan the QR code on the phone that will capture acceleration; tap <b>Connect</b>.</li><li>Secure the phone to the end of the cantilever with athletic wrap: bottom of the phone flush with cantilever's end, screen up.</li><li>Press the other end of the cantilever firmly against a table, leaving <b>80 cm</b> hanging off the edge.</li><li>Press <b>Record</b> on the laptop. Hold still for two seconds, then pull the cantilever's tip down <b>about 10 cm</b> and let go.</li><li>Let it ring until the motion has mostly stopped, about 20 seconds.</li><li>Press <b>Stop</b>. A clean ring-down? <b>Accept</b> it. If not, <b>Try again</b>.</li><li>Repeat with <b>50 cm</b> hanging off the table.</li></ol>",
    feedbackWhen:{"data": "Keep a run in <b>each</b> plot: 80 cm on top, 50 cm below."} },

  { id:"c-window",
    slots:["main", "short"],
    matchX:true,
    lead:"<p>Now you'll use the Fit Damped tool to fit a damped spring solution to your data.</p>",
    check:"What would be the best window to use for Fit Damped?",
    choices:["The whole recording, start to finish", "From one full cycle after you let go, to where the swing sinks into the noise", "Only the first oscillation, where the signal is biggest", "The flat stretch before the release, where nothing is moving"],
    answer:1,
    feedback:"Right. The model is for a spring that has been let go and left alone. Before the release your hand was pushing, and the first swing carries noise from your release. Skip the first cycle, and stop where the ringing dies into sensor noise.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> The model assumes nothing is pushing on the spring. When during your recording was that true, and when could you still see the ringing?"} },

  { id:"c-fit",
    tool:"fitdamped",
    checkKind:"dampfit",
    slots:["main", "short"],
    fitSlot:"main",
    matchX:true,
    lead:"<p><b>Fit it</b>, on the <b>top</b> plot (80 cm) first. Drag from one cycle after the release to where the ringing disappears. The green curve is the best-fit damped spring for that window. Based on the fitted function, work out $\\omega$ and $\\zeta$, to 2 and 3 decimal places, respectively.</p><p class=\"aside\">Recall the general solution $x(t)=e^{-\\zeta\\omega t}\\big[c_1\\sin+c_2\\cos\\big]\\!\\left(\\omega\\sqrt{1-\\zeta^2}\\,t\\right)$.</p><p class=\"aside\">FYI before every fit, Fit Damped subtracts the signal's average so that the fit does not need an offset.</p>",
    feedback:"That is your cantilever: one or two rings per second, and a $\\zeta$ of a percent or two. Lightly damped, like most things made of one solid piece.",
    feedbackWhen:{"fit": "Drag a window across the ring-down with <b>Fit Damped</b> first; the fitted function appears in the readout.", "check": "{label} doesn't follow from the function on screen. {hint}", "empty": "Two boxes: $\\omega$ and $\\zeta$, worked out from the function in the Fit Damped readout.", "dp": "Give $\\omega$ to <b>2</b> decimal places and $\\zeta$ to <b>3</b>.", "low": "{label} is below anything a cantilever and a phone should give. Is the Signal on $\\ddot{z}$, and does your window start one cycle after the release?", "hz": "{label} looks like a frequency in hertz. $\\omega$ is in rad/s: one cycle is $2\\pi$ radians.", "high": "{label} is above anything a cantilever and a phone should give. Did the window catch the release itself, or a rattle of the phone in its tape?"},
    inputs:[
      {label:"cantilever's $\\omega$", key:"c_w", unit:"rad/s", range:[3, 400], dp:2},
      {label:"cantilever's $\\zeta$", key:"c_z", unit:"—", range:[0, 0.5], dp:3} ] },

  { id:"c-shift",
    checkKind:"fshift",
    slots:["main", "short"],
    matchX:true,
    lead:"<p><b>How much does the damping change its resonant frequency?</b> Without friction your cantilever would ring at $\\omega$; with it, it rings at $\\omega\\sqrt{1-\\zeta^2}$. Using your $\\zeta$, find the percent difference, to 4 decimal places, between the two: $$\\frac{\\omega\\sqrt{1-\\zeta^2}-\\omega}{\\omega}\\times100\\%$$</p>",
    feedback:"A few hundredths of a percent, or less. The friction that kills the ringing within seconds barely touches its frequency. For lightly damped systems, $\\omega\\sqrt{1-\\zeta^2}$ and $\\omega$ are almost the same number; from here on, we'll refer to $\\omega$ as the resonant frequency.",
    feedbackWhen:{"empty": "One box: the percent difference, from your $\\zeta$.", "dp": "Give it to <b>4</b> decimal places: it's a small number, and the first few places are all zeros.", "high": "It should be negative: damping makes the spring ring slower than it would without friction.", "low": "That's too large a shift for a $\\zeta$ of a percent or two. The $\\omega$ cancels top and bottom: it's $\\left(\\sqrt{1-\\zeta^2}-1\\right)\\times100$.", "check": "Not quite: with your $\\zeta$ of {z}, $\\left(\\sqrt{1-\\zeta^2}-1\\right)\\times100$ comes to {expected}%."},
    input:"frequency shift", key:"c_shift", unit:"%", range:[-100, 0], dp:4 },

  { id:"c-k",
    checkKind:"kspring",
    slots:["main", "short"],
    matchX:true,
    lead:"<p><b>The spring constant.</b> A mass on a spring rings at $\\omega=\\sqrt{k/m}$. Treat your phone as the mass and the cantilever as a massless spring, and turn your $\\omega$ into the cantilever's effective $k$, to the nearest N/m. Give the phone's mass to the nearest gram.</p><p class=\"aside\">The cantilever has mass too, so you'll slightly overestimate $k$; that's fine, just write what you get.</p>",
    feedback:"Yes that is roughly the effective stiffness of 80 cm of your cantilever.",
    feedbackWhen:{"empty": "Two boxes: your phone's mass in grams, then $k=m\\omega^2$ in N/m.", "dp": "Whole grams and whole N/m, <b>no decimals</b>: the mass you looked up is good to a gram at best.", "low": "{label} is too small. Did you convert grams to kilograms before multiplying by $\\omega^2$?", "high": "{label} is too large. Check that the mass went in as kilograms, not grams.", "check": "Not quite: with your {m} g and $\\omega$ = {w} rad/s, $m\\omega^2$ comes to about {expected} N/m. Convert grams to kilograms first."},
    inputs:[
      {label:"phone mass $m$", key:"c_m", unit:"g", range:[50, 400], dp:0},
      {label:"effective stiffness $k$", key:"c_k", unit:"N/m", range:[1, 100000], dp:0} ] },

  { id:"c-fit-short",
    tool:"fitdamped",
    checkKind:"dampfit",
    slots:["main", "short"],
    fitSlot:"short",
    matchX:true,
    lead:"<p><b>Now the shorter cantilever.</b> Same fit, now on the 50 cm run in the bottom plot: from one cycle after the release to where the ringing disappears. Work out $\\omega$ and $\\zeta$ again, to 2 and 3 decimal places.</p>",
    feedback:"About 60% of the length, and it rings about twice as fast.",
    feedbackWhen:{"fit": "Drag a window across the 50 cm ring-down with <b>Fit Damped</b> first; the fitted function appears in the readout.", "check": "{label} doesn't follow from the function on screen. {hint}", "empty": "Two boxes: $\\omega$ and $\\zeta$, worked out from the function in the Fit Damped readout.", "dp": "Give $\\omega$ to <b>2</b> decimal places and $\\zeta$ to <b>3</b>.", "low": "{label} is low for 50 cm of cantilever. Is the window on the <b>bottom</b> plot, and does it start one cycle after the release?", "hz": "{label} looks like a frequency in hertz. $\\omega$ is in rad/s: one cycle is $2\\pi$ radians.", "high": "{label} is above anything 50 cm of cantilever should give. Did the window catch the release itself, or a rattle of the phone in its tape?"},
    inputs:[
      {label:"50 cm $\\omega$", key:"cs_w", unit:"rad/s", range:[3, 600], dp:2},
      {label:"50 cm $\\zeta$", key:"cs_z", unit:"—", range:[0, 0.5], dp:3} ] },

  { id:"c-ratio",
    slots:["main", "short"],
    matchX:true,
    lead:"<p>You cut the overhang from 80 cm to 50 cm and $\\omega$ went up by about a factor of two. The phone is the same phone.</p>",
    check:"What happened to the cantilever's effective $k$?",
    choices:["It went up by a factor of 1.6, like the length", "It doubled, along with $\\omega$", "It went up by a factor of about four", "Nothing: only the frequency changed"],
    answer:2,
    feedback:"Right. Stiffness $k=m\\omega^2$, so doubling $\\omega$ multiplies $k$ by about $2^2=4$. We won't cover this in class, but a cantilever's stiffness falls off steeply with length, close to $1/L^3$, and $(80/50)^3=1.6^3\\approx4$.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Class F: $\\omega=\\sqrt{k/m}$. Solve for $k$. If $m$ stays the same and $\\omega$ doubles, what does $k$ do?"} },

  { id:"c-cycles",
    slots:["main", "short"],
    matchX:true,
    lead:"<p>We've seen that $1/(\\zeta\\omega)$ is the time constant of decay, that is, the time for the amplitude to shrink by a factor of $e$.</p>",
    check:"Roughly how many <b>oscillation periods</b> fit into that time?",
    choices:["About $\\omega/\\zeta$", "About $1/(2\\pi\\zeta)$, whatever $\\omega$ is", "About $2\\pi/\\omega$", "About $\\zeta\\omega$"],
    answer:1,
    feedback:"Right: the time is $1/(\\zeta\\omega)$, one swing takes $2\\pi/\\omega$, and the $\\omega$s cancel. $\\zeta$ alone says how many rings you get; $\\omega$ says how fast they go by. Your cantilever's $\\zeta$ gives you dozens.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Divide the decay time $1/(\\zeta\\omega)$ by the time for one swing, $2\\pi/\\omega$. What is left?"} },

  { id:"eq-intro",
    top:"html",
    html:"<div class='bigeq'><span class='kicker'>17 October 1989 · 5:04 p.m.</span>The Loma Prieta earthquake,<br>about 100 km from downtown San Francisco</div>",
    lead:"<p><b>Part 2: A skyscraper.</b> 575 Market Street is a 40-story office tower in downtown San Francisco, and the US Geological Survey had put accelerometers in it, from the basement to the top floor. When the Loma Prieta earthquake hit, they recorded it.</p><p>You'll look at displacement data based on two accelerometers: the <b>basement</b>, which moves with the ground, and the <b>top of the tower</b>.</p><p class=\"aside\">Why displacement? Acceleration exaggerates the quick little wiggles of a tall building's higher modes. Displacement shows the slow sway of the whole tower, which is the spring we're after.</p>" },

  { id:"eq-traces",
    slots:["roof", "base"],
    matchY:true,
    matchX:true,
    preload:["roof", "base"],
    lead:"<p>Top: the top of the tower. Bottom: the basement. Both are horizontal displacement along the same direction.</p>",
    check:"From about 22 s on, the basement barely moves, but the top of the tower keeps swaying, each swing smaller than the last. What is the top of the building doing?",
    choices:["Still being shaken by the earthquake, which only reached the top of the building later", "Ringing down on its own: the ground has nearly stopped pushing and the tower is a cantilever that has been let go", "Swaying in the wind, which is unrelated to the earthquake", "Measuring noise: the top instrument is less precise than the basement's"],
    answer:1,
    feedback:"Right. The tower is ringing down, swing by swing. Conceptually, the building is like your cantilever standing upright.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> The basement moves with the ground. If the ground has nearly stopped and the swings keep shrinking, what does that sound like? Think of the cantilever after you let go."} },

  { id:"eq-fit",
    tool:"fitdamped",
    checkKind:"dampfit",
    slots:["roof", "base"],
    fitSlot:"roof",
    matchY:true,
    matchX:true,
    autofill:true,
    lead:"<p><b>Fit the model.</b> With <b>Fit Damped</b>, drag across the top of the tower from about <b>20 s</b> (when the main quake ends) to the end of the record. You turned a fitted function into $\\omega$ and $\\zeta$ on the cantilever; from here on, the fit fills them in for you.</p>",
    feedback:"About one swing every six seconds, and a $\\zeta$ around 0.05: more damping than your cantilever, in a much slower spring.",
    feedbackWhen:{"fit": "Drag a window from about 24 s to the end with <b>Fit Damped</b> first.", "empty": "Drag a window with <b>Fit Damped</b>; the two boxes fill in from the fit.", "low": "{label} is too low for this building. Does your window start after the strong shaking, around 24 s?", "high": "{label} is too high for this building. Make sure the window is on the <b>top</b> plot and starts after the strong shaking, not inside it."},
    inputs:[
      {label:"building's $\\omega$", key:"e_w", unit:"rad/s", range:[0.3, 5], dp:2},
      {label:"building's $\\zeta$", key:"e_z", unit:"—", range:[0, 0.3], dp:3} ] },

  { id:"eq-hz",
    checkKind:"hz",
    slots:["roof", "base"],
    matchY:true,
    matchX:true,
    lead:"<p>Structural engineers usually quote a building's natural frequency in <b>hertz</b>, cycles per second, not radians per second. Convert your $\\omega$ to $f$ to 2 decimal places.</p>",
    feedback:"About 0.16 Hz: a little over six seconds per swing. Tall buildings are slow springs, a lot of mass on a structure that is stiff for its size but not for its height.",
    feedbackWhen:{"empty": "$\\omega$ is radians per second, and one cycle is $2\\pi$ radians.", "dp": "Two decimal places, <b>exactly</b>.", "low": "{label} is too small. Divide $\\omega$ by $2\\pi$; don't multiply.", "high": "{label} is too large. Divide $\\omega$ by $2\\pi$; don't multiply.", "check": "Not quite: your $\\omega$ of {w} rad/s is {expected} Hz. {hint}"},
    input:"building's resonant frequency $f$", key:"e_f", unit:"Hz", range:[0.01, 2], dp:2 },

  { id:"eq-zeta",
    slots:["roof", "base"],
    matchY:true,
    matchX:true,
    lead:"<p>Your tower's $\\zeta$ is about 0.04. That's typical: US building codes assume exactly $\\zeta=0.05$ when they work out how hard an earthquake will shake a structure.</p>",
    check:"575 Market Street does not have built-in shock absorbers. Where does its damping come from?",
    choices:["Air resistance on the outside of the building", "Friction inside the structure: joints, cladding, partition walls and small cracks rubbing as the frame sways", "The ground under the basement absorbs it", "Nowhere: a steel frame has no damping, this is just the accelerometer's signal fading."],
    answer:1,
    feedback:"Right. A real building's damping is dominated by bolted joints, the facade, interior walls, cracks opening and closing. Air resistance is real but a tiny fraction.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> When the frame sways, what parts of a building slide or flex against each other?"} },

  { id:"eq-ruler",
    slots:["roof", "base"],
    matchY:true,
    matchX:true,
    lead:"<p>Your tower's $\\zeta$ is larger than your cantilever's, yet the tower kept swinging for much longer after the strong shaking ended than your cantilever rang after you let go.</p>",
    check:"Why?",
    choices:["The building is heavier, and heavier things ring longer", "The building is vertical, so gravity slowed the damping rather than accelerate it", "The decay time is $1/(\\zeta\\omega)$, and the building's $\\omega$ is about ten times smaller", "The earthquake kept pushing the building after the basement stopped moving"],
    answer:2,
    feedback:"Right. A larger $\\zeta$ means fewer swings, about $1/(2\\pi\\zeta)$ of them. But each of the tower's swings takes about six seconds, and each of your 80 cm cantilever's about half a second. Decay <i>time</i> runs on $\\zeta\\omega$: about 6 s for the cantilever, about 20 s for the tower.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Write the decay time with both numbers in it. Which of the two is wildly different between a cantilever and a skyscraper?"} },

  { id:"a-capture",
    gate:"data",
    requireAxis:"x",
    slots:["relaxed"],
    live:{ slots:["relaxed"] },
    lead:"<p><b>Part 3: Your arm.</b> Let your arm swing from your shoulder, and let it ring like a pendulum.</p><ol><li>Scan the code on the right with your phone again, and tap <b>Connect</b>.</li><li>Secure a phone to your right <b>palm</b> with athletic wrap, screen facing out, top of the phone toward your fingertips.</li><li>Lean to your right so your right arm hangs straight down, completely relaxed.</li><li>Lift (or have someone lift) your right elbow until your arm is about 30 degrees off the vertical.</li><li>Press <b>Record</b>, then let your arm drop and swing until it stops.</li><li>Hit <b>Stop</b>, then <b>Try Again</b> or <b>Accept</b>.</li></ol><p class=\"aside\">Let go, don't push. The goal is a clean release from rest. Try to minimize bending at the elbow. The goal is to measure damping at the shoulder joint.</p>",
    feedbackWhen:{"data": "Nothing kept yet. Record a swing, press <b>Stop</b>, then <b>Accept</b>."} },

  { id:"a-fit-relaxed",
    tool:"fitdamped",
    checkKind:"dampfit",
    slots:["relaxed"],
    autofill:true,
    lead:"<p><b>Fit the swing.</b> Use Fit Damped from one cycle after the release to where the swing fades.</p>",
    feedback:"That is a relaxed arm as a damped spring: roughly one swing a second, and much more damping than the cantilever.",
    feedbackWhen:{"fit": "Drag a window across the swing with <b>Fit Damped</b> first.", "empty": "Drag a window with <b>Fit Damped</b>; the two boxes fill in from the fit.", "low": "{label} is too low for an arm. Is the Signal on $\\ddot{x}$, and does your window start one cycle after the release?", "high": "{label} is too high for an arm. Did the window catch the release itself, or a wobble of the phone in its wrap?"},
    inputs:[
      {label:"arm's $\\omega$", key:"a_w", unit:"rad/s", range:[1, 40], dp:2},
      {label:"arm's $\\zeta$", key:"a_z", unit:"—", range:[0, 0.95], dp:3} ] },

  { id:"a-compare",
    slots:["relaxed"],
    leadFn:a=>{
      // reads back the group's own three ζ (two of them filled from Fit Damped), with 1/(2πζ): the swings it
      // takes each one to shrink by a factor of e. The arm's row is the point (Daniel, 2026-10-16).
      const n=v=>Number.isFinite(v)?v.toFixed(3):"—", sw=z=>(Number.isFinite(z)&&z>0)?(1/(2*Math.PI*z)).toFixed(1):"—";
      const li=(name,z)=>"<li>"+name+": $\\zeta$ = <b>"+n(z)+"</b> &nbsp;·&nbsp; about <b>"+sw(z)+"</b> swings</li>";
      return "<p>Your three springs so far. The swing count is $1/(2\\pi\\zeta)$, about how many swings it takes for the swing to shrink by a factor of $e$.</p>"
        +"<ul>"+li("Cantilever, 50 cm",a.c_z)+li("575 Market Street",a.e_z)+li("Your arm",a.a_z)+"</ul>";
    },
    check:"How does your arm compare with the cantilever and the building?",
    choices:["It is overdamped: it returns to hanging straight down without ever swinging past", "It is also underdamped, but more heavily damped than the others: a few swings and it's done, where the cantilever and building ring for many", "It is less damped than the others, because the arm is heavier", "It has the same $\\zeta$ as the others; only $\\omega$ is different"],
    answer:1,
    feedback:"Right. Your arm still swings past the bottom, so $\\zeta<1$, but it loses a large fraction of its swing every cycle.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Look at the swing counts above. Did your arm swing past the bottom at all? How many swings did it get compared with the cantilever?"} },

  { id:"a-why",
    slots:["relaxed"],
    lead:"",
    check:"Nobody put a shock absorber in your shoulder. Where does the arm's damping primarily come from?",
    choices:["Air resistance on your hand and the phone", "Friction in muscles, tendons and the soft tissue around the joint", "The phone's wrap, rubbing against your palm", "Gravity: a pendulum is damped by gravity, and a cantilever isn't"],
    answer:1,
    feedback:"Right. Living tissue is <i>viscoelastic</i>: part spring, part damper.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Air drag on a hand moving at walking speed is tiny. What parts of your arm stretch and relax as it swings?"} },

  { id:"k-intro",
    slots:["kneeH", "kneeS"],
    preload:["kneeH", "kneeS"],
    attribution:"De Santis & Perez, J NeuroEng Rehabil 21:50 (2024) · CC BY 4.0",
    source:"https://doi.org/10.1186/s12984-024-01326-9",
    lead:"<p><b>Part 4: A knee.</b> Doctors run the experiment you just did on knees to test <b>spasticity</b>, over-reaction in muscles after a spinal cord injury or a stroke. The test: a patient sits on the edge of a table, the examiner lifts the lower leg straight out, and lets go.</p><p>The knee angle ($\\theta$) data above are motion-capture traces from a 2024 study: two adult participants, one with a typical healthy swing (top) and one with a chronic spinal cord injury and spasticity (bottom).</p>" },

  { id:"k-healthy",
    tool:"fitdamped",
    checkKind:"dampfit",
    slots:["kneeH", "kneeS"],
    fitSlot:"kneeH",
    autofill:true,
    lead:"<p><b>A healthy knee (top).</b> Knee angle $\\theta=0$ is the leg held straight out; it settles near $-70^\\circ$, hanging (the dashed line), and Fit Damped measures the swing from there. Fit from the first trough to the end.</p>",
    feedback:"A healthy, relaxed leg is a very good damped spring: the fit should be nearly perfect.",
    feedbackWhen:{"fit": "Drag a window from the first trough ($t\\approx 0.7$ s) to the end with <b>Fit Damped</b> first.", "empty": "Drag a window with <b>Fit Damped</b>; the two boxes fill in from the fit.", "low": "{label} is low. Start the window at the first trough, after the release, and run it to the end.", "high": "{label} is high. Start the window at the first trough, not on the flat stretch before the release."},
    inputs:[
      {label:"healthy $\\omega$", key:"h_w", unit:"rad/s", range:[1, 20], dp:2},
      {label:"healthy $\\zeta$", key:"h_z", unit:"—", range:[0, 0.95], dp:3} ] },

  { id:"k-spastic",
    tool:"fitdamped",
    checkKind:"dampfit",
    slots:["kneeH", "kneeS"],
    fitSlot:"kneeS",
    autofill:true,
    lead:"<p><b>A spastic knee (bottom).</b> Drag Fit Damped from the bottom of the first trough ($t\\approx 0.8$ s)  to the end.</p><p class=\"aside\">This leg doesn't swing about a fixed angle: its resting angle (dashed) sags from about $-40^\\circ$ to $-55^\\circ$ as the reflex lets go. Fit Damped measures each swing from that sagging line.</p>",
    feedback:"Once the leg has been caught, what is left rings a little faster than the healthy leg, with about twice its $\\zeta$: around 0.12 against 0.06.",
    feedbackWhen:{"fit": "Drag a window from about 0.8 s to the end with <b>Fit Damped</b> first.", "empty": "Drag a window with <b>Fit Damped</b>; the two boxes fill in from the fit.", "low": "{label} is low. Start the window at the bottom of the first drop, about 0.8 s, and run it to the end.", "high": "{label} is high. Start the window at the bottom of the first drop, about 0.8 s, not on the drop itself."},
    inputs:[
      {label:"spastic $\\omega$", key:"sp_w", unit:"rad/s", range:[1, 20], dp:2},
      {label:"spastic $\\zeta$", key:"sp_z", unit:"—", range:[0, 0.95], dp:3} ] },

  { id:"k-diagnose",
    slots:["kneeH", "kneeS"],
    leadFn:a=>{
      // the Part 4 punch line (Daniel, 2026-10-17): the group's own two fits side by side, and each knee's
      // resting angle (the dashed lines, from CONFIG.panels rest:). Fixed text, not read from the fit.
      const n=(v,d)=>Number.isFinite(v)?v.toFixed(d):"—";
      const row=(name,w,z,rest)=>"<li><b>"+name+"</b>: $\\omega$ = <b>"+n(w,2)+"</b> rad/s &nbsp;·&nbsp; $\\zeta$ = <b>"+n(z,3)+"</b> &nbsp;·&nbsp; rest angle "+rest+"</li>";
      return "<p>Your two knees, side by side:</p><ul>"+row("Healthy",a.h_w,a.h_z,"steady at <b>−71°</b>")+row("Spastic",a.sp_w,a.sp_z,"sags from <b>−40°</b> to <b>−55°</b>")+"</ul>";
    },
    check:"Which measurement(s) could tell the spastic knee apart from the healthy one?",
