  { id:"model",
    top:"html",
    html:"<div class='bigeq'><span class='kicker'>One model for all five</span>$\\displaystyle x(t)=e^{-\\zeta\\omega t}\\big[c_1\\sin+c_2\\cos\\big]\\!\\left(\\omega\\sqrt{1-\\zeta^2}\\,t\\right)$</div>",
    lead:"<p>This is the solution for a damped spring, the general solution for a function $x(t)$ that satisfies $m\\ddot{x}+\\alpha\\dot{x}+kx=0$. Two terms to focus on: $\\omega \\sqrt{1-\\zeta^2}$ sets how fast the system <b>rings</b>, and $\\zeta \\omega$ sets how fast the ringing <b>dies</b>.</p><p class=\"aside\">$x$ is always measured from rest. Before every fit today, Fit Damped subtracts the signal's average (for the knees, the leg's resting angle), so the fit is exactly this equation and nothing more.</p>",
    check:"Warmup: suppose two bells ring at the same frequency. One has $\\zeta=0.01$, the other $\\zeta=0.1$. Which one will be ringing louder after five seconds?",
    choices:["The one with $\\zeta=0.1$, because more damping means a longer, slower response", "The one with $\\zeta=0.01$: its envelope $e^{-\\zeta\\omega t}$ shrinks ten times more slowly", "Both, equally, because they ring at the same frequency", "Neither: damping stops any spring within a few swings"],
    answer:1,
    feedback:"Right. $\\zeta$ sits in the exponent next to $\\omega$, so at the same $\\omega$ a tenth of the damping ratio buys ten times as long a ring.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Find $\\zeta$ in the model above. Which part of the curve does it control: how fast it wiggles, or how fast the wiggles shrink?"} },

    lead:"<p><b>Part 1: A cantilever</b>.</p><ol><li>Scan the QR code on the phone that will capture acceleration; tap <b>Connect</b>.</li><li>Secure the phone to the end of the cantilever with athletic wrap: bottom of the phone flush with cantilever's end, screen up.</li><li>Press the other end of the cantilever firmly against a table, leaving 50 cm hanging off the edge.</li><li>Press <b>Record</b> on the laptop. Hold still for two seconds, then pull the cantilever's tip down <b>about 10 cm</b> and let go.</li><li>Let it ring until the motion has mostly stopped, about 10 seconds.</li><li>Press <b>Stop</b>. A clean ring-down? <b>Accept</b> it. If not, <b>Try again</b>.</li><li>Repeat with only <b>25 cm</b> hanging off the table.</li></ol>",

      const li=(name,z)=>"<li>"+name+": $\\zeta$ = <b>"+n(z)+"</b> &nbsp;·&nbsp; about <b>"+sw(z)+"</b> swings</li>";
      return "<p>Your three springs so far. The swing count is $1/(2\\pi\\zeta)$, about how many swings it takes for the swing to shrink by a factor of $e$.</p>"

    },
    check:"How does your arm compare with the cantilever and the building?",
    choices:["It is overdamped: it returns to hanging straight down without ever swinging past", "It is also underdamped, but more heavily damped than the cantilever: a few swings and it's done, where the cantilever rings for many", "It is less damped than the cantilever, because the arm is heavier", "It has the same $\\zeta$ as the cantilever; only $\\omega$ is different"],
    answer:1,
    feedback:"Right. Your arm still swings past the bottom, so $\\zeta<1$, but it loses a large fraction of its swing every cycle. One solid piece of plastic barely loses any.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Look at the swing counts above. Did your arm swing past the bottom at all? How many swings did it get compared with the cantilever?"} },

    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Air drag on a hand moving at walking speed is tiny. What parts of your arm stretch and relax as it swings?"} },
