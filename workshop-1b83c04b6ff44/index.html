  // Method 1 (hang time). NOTATION: `t_air`, not `\tau_air` — Class B wrote the airtime that way and this

  { id:"height-hang-1",
    lead:"<p><b>Method 1: time in the air.</b> Use <b>Select Point</b> to note the time you leave the ground (the moment the signal drops to the roughly flat −$g$ run) and the time you land (the moment the signal jumps back upward).</p><p>Your time aloft is $t_\\text{air} = t_\\text{land} - t_\\text{takeoff}$. Phyphox captured data at 100 Hz — one sample every hundredth of a second — so give the time to <b>2 decimal places</b>.</p>",
    feedbackWhen:{"empty":"Read both moments off the trace with <b>Select Point</b>, subtract, and enter the difference — to 2 decimal places.","dp":"The capture is 100 Hz, so a time off this trace is only good to the hundredth of a second. Give $t_\\text{air}$ to <b>exactly 2 decimal places</b>.","negative":"A negative time aloft means the subtraction went the other way round — it is $t_\\text{air} = t_\\text{land} - t_\\text{takeoff}$, landing minus takeoff. Swap them.","low":"That would be a very short flight — under 0.1 s you would barely have left the floor. Check that you took the <i>start</i> and <i>end</i> of the flat $-g$ run.","high":"Over 2 s aloft is a 5 m jump. You have probably picked up the crouch or the landing as well — $t_\\text{air}$ is only the flat $-g$ stretch between them."},
    input:"$t_\\text{air}$", key:"tair", unit:"s",

  { id:"height-hang-2",
    checkKind:"hang",
    lead:"<p><b>Back to Class B.</b> We solved exactly this problem there — a body launched straight up under constant gravity — and wrote down two results: $t_\\text{air} = 2\\dot y_0/g$ and $y_\\text{apex} = \\dot y_0^{2}/2g$.</p><p>You just estimated $t_\\text{air}$, so use the first formula to recover the launch speed $\\dot y_0$, then the second to get the height. Your time was good to a hundredth of a second, and squaring it doubles that uncertainty — so answer <b>to the nearest cm</b>.</p>",
    feedback:"Right, that is your jump height, measured from the clock alone — no ruler, no camera, just the moment you left the floor and the moment you came back. How did you do compared to Chris Spell's 5'3\"??",
    feedbackWhen:{"empty":"Two steps: $\\dot y_0$ from your $t_\\text{air}$, then $y_\\text{apex}$ from that $\\dot y_0$. Enter the height in cm.","dp":"Your $t_\\text{air}$ is good to a hundredth of a second, and $y_\\text{apex}$ goes as $t_\\text{air}^2$, so that uncertainty doubles — a centimeter is as fine as this answer gets. Give it <b>to the nearest cm</b>, no decimals.","low":"Too small. Check that you converted meters to centimeters.","high":"Too large for a standing jump. Feed $\\dot y_0$ into $y_\\text{apex} = \\dot y_0^{2}/2g$, then convert to cm.","check":"Note quite. Work it in two steps: $\\dot y_0 = g\\,t_\\text{air}/2$, then $y_\\text{apex} = \\dot y_0^{2}/2g$. Stopping after the first leaves you holding a speed, not a height."},

    answer:[0,1],
    feedback:"Both of the first two are fair. Physically, your phone may not have ended at the exact height at which it started. On top of that, double-integrating acceleration multiplies every tiny bias or bit of noise by time <i>twice</i>, so error piles up into drift.",
    feedbackWhen:{"wrong":"<b>Discuss for a minute.</b> Two of these are real. One asks what your body did; the other asks what the arithmetic does to a small error over several seconds. The other two would have shown up long before this step."} },

  // apparent weight (analyzer — Average over the push-off). `checkKind:"gfactor"` (2026-09-03) checks the
  // typed number against 1 + a/g for the average the green box is showing right now. Before it, this box
  // took any number from 1 to 8 — including the raw acceleration — and the punchline the whole workshop
  // builds toward was computed from it.
  { id:"apparent-weight",
    checkKind:"gfactor",
    lead:"<p><b>Apparent weight — your felt g's.</b> Switch to <b>Average Value</b> and drag across the <b>push-off drive</b> — the big positive hump just before you leave the ground — to read your <b>average $\\ddot{y}$</b> over that launch. Then work out the <b>g's</b> you felt over that launch, $1 + \\ddot{y}/g$. Phyphox's acceleration is good to about $\\pm 0.005$ m/s$^2$, so give your g's to <b>3 decimal places</b> and no more.</p>",
    feedback:"That is what the floor was doing to you — for a fraction of a second you felt that you weighed that number times your own weight.",
    feedbackWhen:{"empty":"Drag across the push-off hump with <b>Average Value</b>, read the green box, then enter $1 + \\ddot{y}/g$.","dp":"The green box reads to 2 decimal places and phyphox is good to about $\\pm 0.005$ m/s$^2$, so $1 + \\ddot{y}/g$ is only meaningful to the third decimal. Give it to <b>exactly 3 decimal places</b>.","low":"Under 1 g would mean the floor pushed <i>less</i> than your weight — be sure you're dragging over the right hump.","high":"Above 8 g would happen in a car crash, not a jump. Check that you averaged correctly.","check":"That doesn't match your own plot — the green box reads {avg} m/s$^2$, so $1 + \\ddot{y}/g$ works out to about {expected}. Divide by $g$, then add 1."},
    input:"average over the push-off", key:"gfactor", unit:"g's",
    range:[1,8], dp:3 },

  /* ---------------------------------------------------------------------------------------------
     THE ELEVATOR SECTION. Students take the laptop to the MEC elevator, scan a QR posted in the car,
     answer what it asks, and record two rides. RENDER-TIME PUNCH LIST: (1) print the QR sheet and tape
     it inside the car; (2) push -github-site/elevator/ so the QR resolves; (3) shoot
     media/elevator-capture.mp4.
     The gate went back to a QR on 2026-09-03, having been a printed word since 2026-08-21. The reversal
     is not a change of mind about QR-vs-print: it is that the hosted page now does real work. A printed
     word is a token you walk to and copy. This page asks a question you can only answer standing in the
     car — read the capacity plate, 4000 lbs, convert it to kN, round — so the trip produces a small piece
     of physics rather than a piece of string. Both spellings of the answer are accepted (18, eighteen).
     The real proof of the trip is still not the passcode, which one student could text to the room — it
     is the two elevator CSVs they have to come back with.
     --------------------------------------------------------------------------------------------- */
  { id:"elevator",
    code:{ hash:[4320836341417941,2228546580717157], label:"Passcode from the MEC elevator", wrong:"Not yet — the code is behind the QR code posted inside the elevator car itself." },
    lead:"<p><b>Field trip.</b> Bring your laptop and head for the <b>elevator on this floor</b>. Inside the car you'll find a QR code — scan it, answer what it asks, then type the passcode here.</p>" },

  { id:"elevator-capture",
    top:"video",
    media:"media/elevator-capture.mp4",
    lead:"<p><b>Two rides, two recordings</b> — follow the video:</p><ol><li>In <b>phyphox</b>, <b>clear</b> your jump data (the trash icon) so you start from an empty file.</li><li>Stay on <b>Acceleration (without g)</b>.</li><li>Put the phone <b>flat on the elevator floor, screen up</b>.</li><li>Press <b>play</b>, wait two seconds, then go up one floor.</li><li>Wait until the elevator comes to a complete stop.</li><li>Press <b>⏸ Pause</b>, then <b>⋮ Export Data → CSV</b> (Comma, decimal point).</li><li><b>Clear</b> the data, then do the whole thing again riding <b>down one floor</b> (Not shown in the video). You should end up with two .zip files.</li></ol><p class=\"aside\">Only a timestamp will tell your files apart, so note which one you do first.</p>" },

  // Two slots, stacked, one file picker each. requireAxis:"z" locks the vertical axis on BOTH —
  // the phone is flat on the floor, so up is z, and making them find that twice in a dropdown is a chore.
  { id:"elevator-load",
    gate:"data",
    requireAxis:"z",
    slots:["up","down"],
    lead:"<p><b>Load both rides.</b> There are two plots now, each with its own file picker: <b>Going Up</b> on top, <b>Going Down</b> below.</p><p>Be sure that both are showing $\\ddot{z}$, because the phone was lying flat on its back.</p>",
    feedbackWhen:{"data":"Both plots need a file — use the picker above each one. If they went in the wrong way round, just load them again."} },

  // The crop step. Gated, deliberately: uncropped, the ride is ~3% of the plot height and a student who
  // clicks past this lands on the next step staring at a flat line with no idea what went wrong.
  { id:"elevator-crop",
    gate:"crop",
    slots:["up","down"],
    lead:"<p>The beginning and end of your data may have noise that overwhelms the signal in between. Click <b>Crop</b> and drag across the stretch you want to keep — just before the elevator started to just after it stopped. The vertical axis should rescale to what's left. Crop both Going Up and Going Down.</p>",
    feedbackWhen:{"crop":"Both plots need cropping. Click <b>Crop</b>, then drag the amber bounds inward on each one — from just before the elevator moves to just after it stops."} },

  /* The four measurements. Each one turns a number read off a trace into the g's you felt and then asks
     which way the g's pushed, and the four answers collapse to TWO — start-up and stop-down are both
     eyeballs-down, stop-up and start-down are both eyeballs-up. That repetition is the lesson, not a
     redundancy: what you feel is set by the acceleration, never by the direction you happen to be
     traveling. "Eyeballs-in/-out" are live distractors, not filler — Class C taught the convention with
     the Brulle g-tolerance figure, where in vs. down vs. up is the whole point.
     They ask for the G-FACTOR rather than the raw z-double-dot as of 2026-09-03. The arithmetic is one
     divide and one add, they did it once already for their jump, and doing it four more times is what
     makes the closing comparison theirs rather than ours. `checkKind:"gfactor"` checks each against the
     green box.
     Before the four: two questions about the FLAT stretch, which is the part of the trace students find
     hardest to believe. The first asks why a moving elevator reads zero; the second asks whether zero
     acceleration means zero force, which is the misreading of F = m·r̈ that survives the whole semester
     if nobody names it. */
  { id:"elevator-steady",
    slots:["up","down"],
    lead:"<p>With the noise gone you can see the shape of a ride: a bump at each end and a long flat stretch in between.</p>",
    check:"Why is the signal roughly zero between the two floors, even though you're moving?",
    choices:["Because the trace is acceleration — the change in velocity over time — and between floors your velocity isn't changing","Because the elevator is moving slowly between floors","Because the phone stops recording while the doors are shut","Because gravity was removed from the signal"],
    answer:0,
    feedback:"Right — the plot is $\\ddot{z}$, not $\\dot{z}$. Between floors you are moving at a steady speed, so $\\dot{z}$ isn't <i>changing</i> and $\\ddot{z}$ reads about zero. Constant velocity is indistinguishable from standing still, which is exactly why you can't feel it.",
    feedbackWhen:{"wrong":"<b>Discuss for a minute.</b> Look at what is on the vertical axis. The elevator is definitely moving in that stretch — so what quantity could be zero while the motion isn't?"} },

  { id:"elevator-noforce",
    slots:["up","down"],
    lead:"<p>The acceleration is about zero between floors, and $\\underline{F} = m\\ddot{\\underline{r}}$.</p>",
    check:"Does that mean there are no forces acting on you during that stretch?",
    choices:["No — gravity and the normal force are both acting; they just cancel","Yes — zero acceleration means zero force","No — only gravity is acting, and it is too small to see","Yes, apart from air resistance inside the car"],
    answer:0,
    feedback:"Right — $\\underline{F} = m\\ddot{\\underline{r}}$ is about the <b>net</b> force. Gravity pulls down with $mg$, the floor pushes up with $\\underline{F}_N$ of the same size, and the two cancel. Zero <i>net</i> force, not zero forces — which is also why a bathroom scale in an elevator at steady speed reads exactly your weight.",
    feedbackWhen:{"wrong":"<b>Discuss for a minute.</b> You are standing on the floor of the car the whole time. Is the floor touching you? Is the Earth still pulling on you?"} },

  // The symmetry with the jump, and the only step in the workshop where the instrument is shown to be
  // the WRONG tool (added 2026-09-07). Double integration over a 15-second ride drifts to roughly twice
  // the true floor height — the demo capture lands near 30 ft against a real 15 — which is the same
  // t-squared error the `drift` step named on a jump lasting a third of a second, now large enough to
  // see with a tape measure. The stairwell's cinder blocks are the tape measure.
  // Both gates are deliberately SOFT: the first only proves they dragged the window and converted to
  // feet, the second only that a plausible number of blocks got counted. No `dp:` on either — the point
  // is the comparison, not the precision.
  { id:"elevator-height",
    checkKind:"dblintft",
    slots:["up","down"],
    lead:"<p><b>How high is a floor?</b> As in the jump data, if you double integrate the acceleration you should get position. Switch to <b>Double Integrate</b> and drag across the <b>Going Up</b> ride — from just before the elevator starts accelerating to just after it stops decelerating. The tool's <b>end value</b> is its estimate of the change in $z$ over the ride; enter it below <b>in feet</b>.</p><p>Then count the cinder blocks in the stairwell. Each one is 8 inches tall — about how far did the elevator actually travel?</p>",
    feedback:"Yes — and notice they probably don't agree. As with your jump, double integration turns small errors into a drift that grows with <b>time squared</b>, and this ride is several seconds long. The accelerometer is not a good tool for measuring floor height.",
    feedbackWhen:{"empty":"Both boxes: the tool's end value converted to feet on the left, and your cinder-block count on the right.","low":"{label} looks too small — both boxes want <b>feet</b>, and the tool's readout is in centimeters.","high":"{label} looks too large for one floor — check your units; both boxes want <b>feet</b>.","check":"That doesn't match the curve — the tool's end value reads {cm} cm, which is {expected} ft. Convert the number the tool is showing."},
    inputs:[
      {label:"$z_\\text{est}$", key:"z_est", unit:"ft", range:[-100,200]},
      {label:"$z_\\text{act}$", key:"z_act", unit:"ft", range:[10,20]} ] },

  { id:"elevator-up-start",
    checkKind:"gfactor",
    slots:["up","down"],
    lead:"<p><b>Going up — the start.</b> On the <b>top</b> plot, switch to <b>Average Value</b> and drag across the first bump, where the elevator got moving. Read the average $\\ddot{z}$ out of the green box, then turn it into the <b>g's</b> you felt, the way you did for your jump: $1 + \\ddot{z}/g$. Phyphox's acceleration is good to about $\\pm 0.005$ m/s$^2$, so give your g's to <b>3 decimal places</b> and no more.</p>",
    check:"Which way are the g's pushing?",
    choices:["Eyeballs-down — pressed toward the floor, blood driven toward your feet","Eyeballs-up — lightened, blood driven toward your head","Eyeballs-in — blood driven toward your back","Eyeballs-out — blood driven toward your chest"],
    answer:0,
    feedback:"Right — the floor has to push <i>harder</i> than your weight to accelerate you upward, so you came out above 1 g and the g's run head-to-toe. Same direction as the push-off phase of your jump.",
    feedbackWhen:{"empty":"Drag across the first bump on the <b>top</b> plot, read the green box, then enter $1 + \\ddot{z}/g$.","dp":"The green box reads to 2 decimal places and phyphox is good to about $\\pm 0.005$ m/s$^2$, so $1 + \\ddot{z}/g$ is only meaningful to the third decimal. Give it to <b>exactly 3 decimal places</b>.","low":"Your value should be above 1, because you feel heavier during the start of the ride up. Check that you divided by $g$ before adding 1 — and that you dragged the <i>first</i> bump on the top plot.","high":"An elevator never gets past about 1.15 g. That looks like maybe the raw acceleration rather than $1 + \\ddot{z}/g$?","check":"That doesn't match your own plot — the green box reads {avg} m/s$^2$, so $1 + \\ddot{z}/g$ works out to about {expected}.","wrong":"<b>Discuss for a minute.</b> This bump came out <i>above</i> 1 g, so the floor is pushing harder than your weight. Which way does that press your body?"},
    input:"starting up", key:"g_up_start", unit:"g's",
    range:[0.85,1.15], dp:3 },

  { id:"elevator-up-stop",
    checkKind:"gfactor",
    slots:["up","down"],
    lead:"<p><b>Going up — the stop.</b> Still on the top plot, drag across the second bump, where the elevator slowed to a halt. Same arithmetic: $1 + \\ddot{z}/g$. Same precision: 3 decimal places.</p>",
    check:"Which way are the g's pushing?",
    choices:["Eyeballs-down — pressed toward the floor, blood driven toward your feet","Eyeballs-up — lightened, blood driven toward your head","Eyeballs-in — blood driven toward your back","Eyeballs-out — blood driven toward your chest"],
    answer:1,
    feedback:"Right — to stop you while you're still moving up, the floor pushes <i>less</i> than your weight, you drop below 1 g, and you go light. Same direction as at the top of your jump.",
    feedbackWhen:{"empty":"Drag across the second bump on the <b>top</b> plot, read the green box, then enter $1 + \\ddot{z}/g$.","dp":"The green box reads to 2 decimal places and phyphox is good to about $\\pm 0.005$ m/s$^2$, so $1 + \\ddot{z}/g$ is only meaningful to the third decimal. Give it to <b>exactly 3 decimal places</b>.","low":"An elevator never gets below about 0.85 g. That looks like maybe the raw acceleration rather than $1 + \\ddot{z}/g$?","high":"Your value should be below 1, because you feel lighter during the stop at the top. Check that you divided by $g$ before adding 1 — and that you dragged the <i>second</i> bump on the top plot.","check":"That doesn't match your own plot — the green box reads {avg} m/s$^2$, so $1 + \\ddot{z}/g$ works out to about {expected}.","wrong":"<b>Discuss for a minute.</b> This one came out <i>below</i> 1 g — the floor is pushing less than your weight. What does that feel like, and which way does your blood go?"},
    input:"stopping while going up", key:"g_up_stop", unit:"g's",
    range:[0.85,1.15], dp:3 },

  { id:"elevator-down-start",
    checkKind:"gfactor",
    slots:["up","down"],
    lead:"<p><b>Going down — the start.</b> Now the <b>bottom</b> plot. Drag across its first bump, where the elevator started descending, and turn it into g's.</p>",
    check:"Which way are the g's pushing?",
    choices:["Eyeballs-down — pressed toward the floor, blood driven toward your feet","Eyeballs-up — lightened, blood driven toward your head","Eyeballs-in — blood driven toward your back","Eyeballs-out — blood driven toward your chest"],
    answer:1,
    feedback:"Right — and notice that's the <i>same response</i> you gave for stopping at the top, even though one ride was going up and this one is going down.",
    feedbackWhen:{"empty":"Drag across the first bump on the <b>bottom</b> plot, read the green box, then enter $1 + \\ddot{z}/g$.","dp":"The green box reads to 2 decimal places and phyphox is good to about $\\pm 0.005$ m/s$^2$, so $1 + \\ddot{z}/g$ is only meaningful to the third decimal. Give it to <b>exactly 3 decimal places</b>.","low":"An elevator never gets below about 0.85 g. That looks like maybe the raw acceleration rather than $1 + \\ddot{z}/g$?","high":"Your value should be below 1, because you feel lighter during the start of the ride down. Check that you divided by $g$ before adding 1 — and that you dragged the <i>first</i> bump on the bottom plot.","check":"That doesn't match your own plot — the green box reads {avg} m/s$^2$, so $1 + \\ddot{z}/g$ works out to about {expected}.","wrong":"<b>Discuss for a minute.</b> Compare what you just entered with the reading from stopping at the top. They are on the same side of 1 g — so the answer here is the same as it was there."},
    input:"starting down", key:"g_down_start", unit:"g's",
    range:[0.85,1.15], dp:3 },

  { id:"elevator-down-stop",
    checkKind:"gfactor",
    slots:["up","down"],
    lead:"<p><b>Going down — the stop.</b> Last one: the second bump on the bottom plot.</p>",
    check:"Which way are the g's pushing?",
    choices:["Eyeballs-down — pressed toward the floor, blood driven toward your feet","Eyeballs-up — lightened, blood driven toward your head","Eyeballs-in — blood driven toward your back","Eyeballs-out — blood driven toward your chest"],
    answer:0,
    feedback:"Right — four events, two answers. <b>Speeding up going up, or slowing down going down</b>, presses you into the floor; <b>speeding up going down, or slowing down going up</b>, lightens you. Your velocity $\\dot{z}$, and therefore the direction you were traveling, never entered the calculation — only your acceleration $\\ddot{z}$ did.",
    feedbackWhen:{"empty":"Drag across the second bump on the <b>bottom</b> plot, read the green box, then enter $1 + \\ddot{z}/g$.","dp":"The green box reads to 2 decimal places and phyphox is good to about $\\pm 0.005$ m/s$^2$, so $1 + \\ddot{z}/g$ is only meaningful to the third decimal. Give it to <b>exactly 3 decimal places</b>.","low":"Your value should be above 1, because you feel heavier during the stop at the bottom. Check that you divided by $g$ before adding 1 — and that you dragged the <i>second</i> bump on the bottom plot.","high":"An elevator never gets past about 1.15 g. That looks like maybe the raw acceleration rather than $1 + \\ddot{z}/g$?","check":"That doesn't match your own plot — the green box reads {avg} m/s$^2$, so $1 + \\ddot{z}/g$ works out to about {expected}.","wrong":"<b>Discuss for a minute.</b> This one came out <i>above</i> 1 g, the same side as starting the upward ride. Two of your four events feel the same; this is one of them."},
    input:"stopping while going down", key:"g_down_stop", unit:"g's",
    range:[0.85,1.15], dp:3 },

  // leadFn: reads the student's own four g's readings back so the question below has something to point at
  // without them scrolling through four steps to find it. Skipped by sync_lead.py (no literal to write).
  // This replaced a step that asked them to pick the biggest of the four and type it in again — a data-
  // entry task where a question belonged.
  { id:"elevator-why",
    slots:["up","down"],
    leadFn:a=>{
      const n=v=>Number.isFinite(v)?v.toFixed(2):"—";
      return "<p>Your four readings, in g's:</p>"
        +"<ul><li>starting up <b>"+n(a.g_up_start)+"</b> &nbsp;·&nbsp; stopping up <b>"+n(a.g_up_stop)+"</b></li>"
        +"<li>starting down <b>"+n(a.g_down_start)+"</b> &nbsp;·&nbsp; stopping down <b>"+n(a.g_down_stop)+"</b></li></ul>"
        +"<p>The two biggest are almost certainly the <b>start of Going Up</b> and the <b>end of Going Down</b>.</p>";
    },
    check:"Why those two?",
    choices:["In both, the acceleration points <b>upward</b>, so the floor has to push harder than your weight","Because in both the elevator is traveling upward","Because those are the moments the elevator is moving fastest","Because the motor has to work hardest against gravity at those moments"],
    answer:0,
    feedback:"Right — starting an upward ride and stopping a downward one both mean $\\ddot{z} > 0$, and $\\underline{F}_N = m(g + \\ddot{z})$ is bigger than your weight either way. The direction you happened to be <i>traveling</i> never came into it.",
    feedbackWhen:{"wrong":"<b>Discuss for a minute.</b> One of these two events is a ride going up, the other a ride going down — so it isn't about travel direction. Look at the sign of $\\ddot{z}$ in each, and at what $\\underline{F}_N = m(g + \\ddot{z})$ then has to be."} },

  // the punchline: their own jump g's against their own biggest elevator reading, which is the comparison
  // the whole workshop has been building toward and is far better in their numbers than in ours.
  // slots kept on the elevator: this step reads back their elevator numbers, so dropping the panels
  // to the jump data underneath it was just confusing.
  { id:"elevator-punchline",
    slots:["up","down"],
    leadFn:a=>{
      const n=v=>Number.isFinite(v)?v.toFixed(2):"—";
      // "Biggest" is the LARGEST reading, not the one furthest from 1 — Daniel, 2026-09-03, and the
      // reason is biological rather than arithmetic. This course discusses g's in terms of what a body
      // tolerates (Class C: the Brulle figure, the shuttle recline, "felt g's are biomedically
      // critical"), and a body is happier at a sustained 0 g than at a sustained 1.9 g even though 0 is
      // further from 1. Distance-from-1 measures how hard the accelerometer is working; max measures how
      // hard the ride is on the person, which is the thing this workshop is about.
      const four=[a.g_up_start,a.g_up_stop,a.g_down_start,a.g_down_stop].filter(v=>Number.isFinite(v));
      const big=four.length?Math.max(...four):NaN;
      return "<p><b>Same story, twice.</b> Your legs launched you at about <b>"+n(a.gfactor)+"</b> g's. "
        +"The MEC elevator managed <b>"+n(big)+"</b>, so slight you only notice it in your stomach "
        +"for half a second.</p>"
        +"<p>Both are the same physics: the floor pushing on you with something other than your own weight. "
        +"The accelerometer never cared which one was dramatic.</p>"
        +"<p class=\"aside\">This is why a scale in an elevator is such a durable exam question. It feels like "
        +"a trick, and it is only $\\underline{F}_N = m(g + \\ddot{z})$ read carefully.</p>";
    } },

  // Two closing concept questions (added 2026-09-03), which is what turns the punchline from a slide
  // students click past into a claim they have to use. Both answers are "greater than your weight", and
  // that is the point: the second one PAIRS A DOWNWARD MOTION WITH AN UPWARD ACCELERATION, which is the
  // step almost everyone gets wrong the first time. Deliberately left on the jump panel rather than the
  // elevator's — the elevator numbers were just read back above; the jump is the half of the pairing
  // that is furthest away by now.
  { id:"normal-launch",
    slots:["up","down"],
    lead:"",
    check:"As your legs pushed to launch your jump, and as the Going Up elevator began to move, the normal force applied to your feet was…",
    choices:["Greater than your weight","Equal to your weight","Less than your weight"],
    answer:0,
    feedback:"Right — both are an <i>upward</i> acceleration, so $\\underline{F}_N = m(g + \\ddot{y}) > mg$. One of them threw you into the air and the other moved you into an upward climb through the elevator shaft.",
    feedbackWhen:{"wrong":"<b>Discuss for a minute.</b> In both cases you start at rest and end up moving upward. Which way does the acceleration point, and what does $\\underline{F}_N = m(g + \\ddot{y})$ then give you?"} },

  { id:"normal-land",
    slots:["up","down"],
    lead:"",
    check:"As your legs pushed to cushion your landing, and as the Going Down elevator came to rest, the normal force applied to your feet was…",
    choices:["Greater than your weight","Equal to your weight","Less than your weight"],
    answer:0,
    feedback:"Right. You were moving <i>down</i> in both, but you were <i>slowing</i>, which is an upward acceleration, so the floor pushed harder than your weight, in both cases.",
    feedbackWhen:{"wrong":"<b>Discuss for a minute.</b> You are moving downward in both — but are you speeding up or slowing down? Which way does the acceleration point while you slow?"} },

  // copy-out summary (the deliverable): paste into the Canvas post-lab quiz + upload all three raw CSVs
  { id:"summary",
    top:"html",
    html:"<div class='bigeq'>Nice work.</div>",
    lead:"<p><b>You're done.</b> Copy the summary below and paste it into the Workshop 1 — Exit Quiz on Canvas, where you'll be asked to upload <b>all three</b> raw phyphox exports — the jump and both elevator rides. That's the whole deliverable — no report.</p><p><b>Everyone submits — not just whoever's laptop is open.</b> If you worked as a pair or a three, each of you pastes the same summary and uploads the same file(s). The quiz is per student.</p>",
    summary:{ rows:15, lines:["Workshop 1 · Get Air","Jump data: {file}","Time in the air: {tair} s","Jump height — hang time: {y_apex} cm","Jump height — double integration: {y_peak} cm","Felt g's at push-off: {gfactor}","Elevator up: {file_up}","Elevator down: {file_down}","Elevator rise — double integration: {z_est} ft","Elevator rise — cinder blocks: {z_act} ft","g's — starting up: {g_up_start}","g's — stopping while going up: {g_up_stop}","g's — starting down: {g_down_start}","g's — stopping while going down: {g_down_stop}"] } },
];
</script>
