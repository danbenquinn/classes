    feedbackWhen:{"empty": "$\\Delta(m\\dot{x}) = m\\,\\Delta\\dot{x}$, and the chair went from $\\dot{x}_\\text{before}$ to rest.", "dp": "Your speed is good to a hundredth of a m/s, times a chair's worth of kilograms. Give it to <b>exactly 1 decimal place</b>.", "low": "That is more momentum than an office chair at walking pace can carry. Check your mass and be sure you used kilograms.", "high": "It should be <i>negative</i>: the chair was moving in $+x$ and ended at rest, so $m\\,(0 - \\dot{x}_\\text{before}) < 0$.", "check": "Not quite. $\\Delta(m\\dot{x}) = m\\,(0 - \\dot{x}_\\text{before})$. Your number implies a chair with an unrealistic mass."},
    input:"$\\Delta(m\\dot{x}) = (m\\dot{x})_2 - (m\\dot{x})_1$", key:"imp_x", unit:"kg·m/s", range:[-60,0], dp:1 },

  { id:"impulse-concept",
    lead:"<p>The number you just computed, $\\Delta(m\\dot{x})$, is the change in the chair's $x$ momentum.</p>",
    check:"What else is it equal to?",
    choices:["The chair's kinetic energy just before the collision", "The $x$-component of the impulse the wall delivered to the chair, $\\int F_x\\;\\mathrm{d}t$", "The average force the wall exerted", "The work the wall did on the chair"],
    answer:1,
    feedback:"Right: the impulse–momentum theorem says $\\int\\underline{F}\\;\\mathrm{d}t = \\Delta(m\\dot{\\underline{r}})$: integrate Newton's second law over the collision and the change in momentum on one side <i>is</i> the force integrated over time on the other.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Class E integrated $\\underline{F} = m\\ddot{\\underline{r}}$ over time. What did the two sides come out to?"} },

  { id:"force-endpoints",
    checkKind:"wallforce",
    lead:"<p><b>Average force.</b> Impulse is force integrated over time, so the <i>average</i> force over the collision is the impulse divided by how long the collision lasted, $\\Delta t$: $F_{x,\\text{avg}} = \\Delta(m\\dot{x})/\\Delta t$. Record the start and end times of the interval over which you calculated $\\Delta(m\\dot{x})$, then estimate $F_{x,\\text{avg}}$ rounded to the nearest $N$.</p>",
    feedback:"Yes that is the wall's average push on the chair over the collision — a few pounds of force, spread over a fraction of a second.",
    feedbackWhen:{"empty": "You need impulse divided by time difference.", "dp": "The capture is 100 Hz, so a time off this trace is good to a hundredth of a second — give both to <b>exactly 2 decimal places</b>. The force divides a tenth-of-a-N·s impulse by a hundredth of a second, which is good to a few newtons, so give it to the nearest newton, <b>no decimals</b>.", "low": "{label} is out of range. The force should be negative (the wall pushes back against travel) but a hand-launched chair should not see that much <i>average</i> force — check that $\\Delta t$ is in seconds.", "high": "$F_{x,\\text{avg}}$ should be negative, because the impulse is negative. The wall pushes against the direction of travel.", "check": "Not quite. $F_{x,\\text{avg}} = \\Delta(m\\dot{x})/(t_\\text{end} - t_\\text{start})$. Check that end comes after start."},
    inputs:[
      {label:"collision start", key:"t_hit0", unit:"s", range:[0,30], dp:2},
      {label:"collision end", key:"t_hit1", unit:"s", range:[0,30], dp:2},
      {label:"average force $F_{x,\\text{avg}}$", key:"F_avg", unit:"N", range:[-500,0], dp:0} ] },

  { id:"gforce",
    checkKind:"wallg",
    lead:"<p><b>Average g's.</b> So far we've only discussed \"g's\" for vertical motion, so we've used $\\frac{F_N}{mg}=1 + \\ddot{y}/g$, where the $1$ comes from the weight term. Engineers generalize the same idea to <i>any</i> contact force: the g's you feel are the <b>contact force divided by your weight</b>, $F/mg$. Here the contact force is the wall's average push on the chair, so the average g's over the collision is $|F_{x,\\text{avg}}|/mg$. Give it to 2 decimal places.</p>",
    feedback:"A fraction of a g, averaged over the collision.",
    feedbackWhen:{"empty": "Divide the average force by the chair's weight, $mg$. Positive — it is a magnitude.", "dp": "Your force is good to a few newtons out of about ninety of weight, so this is meaningful to the second decimal. Give it to <b>exactly 2 decimal places</b>.", "low": "Under 0.01 g would be a collision you could not feel. Check that you divided by $mg$, not by $m$ alone.", "high": "Over 5 g averaged across a whole collision is a car crash. Check that you divided the <i>force</i> by the <i>weight</i> — both in newtons.", "negative": "g's are a size — use the magnitude of the force, so the answer is positive.", "check": "Not quite — $|F_{x,\\text{avg}}|/(mg)$ with your average force and your chair's mass is about {expected} g's. Remember to look up $g$ and to use the weight, not the mass."},
    input:"average g's over the collision", key:"g_wall", unit:"g's", range:[0.01,5], dp:2 },

  { id:"g-peak",
    checkKind:"wallgpeak",
    lead:"<p><b>Now the peak g's.</b> An average over the collision hides transient high and low g's. Switch to <b>Select Point</b> and click the tip of the <b>tallest spike</b> in the collision — positive or negative — then convert that peak $|\\ddot{x}|$ to <b>peak g's</b> by dividing by g. Give it to 1 decimal place.</p>",
    feedback:"Right: several times the average. For a fraction of a hundredth of a second the chair was being pushed that many times harder than its own weight. Keep both numbers in mind: high average force means high impulse, but high peak force is what breaks things.",
    feedbackWhen:{"empty": "Click the tip of the tallest spike with <b>Select Point</b>, read $\\ddot{x}$, take its size, divide by $g$.", "dp": "Select Point prints $\\ddot{x}$ to 2 decimals; divided by $g$ that is worth about a tenth of a g. Give it to <b>exactly 1 decimal place</b>.", "low": "That seems too low for a collision. Be sure you clicked the tip of the tallest spike and give the absolute value.", "high": "Over 20 g is more than a chair against a wall should give. Check that you divided by $g$, and that the Signal is $\\ddot{x}$.", "negative": "We asked for the <i>size</i> of the peak — give it as a positive number.", "check": "Not quite — the tallest spike reads about {peak} m/s$^2$, which is {expected} g's in size. Click right on its tip."},
    input:"peak g's during the collision", key:"g_peak", unit:"g's", range:[0.1,20], dp:1 },

  { id:"rider-impulse",
    lead:"<p><b>Do not try this.</b> Suppose someone had been sitting in the chair, and chair plus rider hit the wall at the <i>same pre-collision speed</i> $\\dot{x}_\\text{before}$ you just measured.</p>",
    check:"Compared to the wall's impulse on the empty chair, the impulse on chair-plus-rider would be…",
    choices:["The same — the wall is the same wall, so its impulse is the same", "Smaller — the rider's legs absorb some of it", "Larger — more mass at the same speed is more momentum, and the wall has to remove all of it", "Larger, but only because the rider makes the chair go faster"],
    answer:2,
    feedback:"Right. Impulse equals the change in momentum, and the momentum to be removed is $m\\,\\dot{x}_\\text{before}$: bigger mass, bigger momentum, bigger impulse, at the same speed.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> The impulse is set by how much momentum the wall has to take away. Which of $m$ and $\\dot{x}$ changed when the rider got on?"} },

  { id:"rider-force",
    lead:"<p>Same thought experiment: chair plus rider, same speed — and suppose the collision with the wall lasts about <b>as long</b> as it did for the empty chair.</p>",
    check:"Compared to the average force the wall exerted on the empty chair, the average force on chair-plus-rider would be…",
    choices:["The same — the wall pushes back only as hard as it is pushed, and the wall did not change", "Smaller — the extra mass makes the collision gentler", "Larger, but only if the rider was leaning forward", "Larger — a larger impulse delivered over the same time is a larger average force"],
    answer:3,
    feedback:"Right: $F_{x,\\text{avg}} = \\Delta(m\\dot{x})/\\Delta t$. The impulse went up with the mass; $\\Delta t$ stayed put; so the average force went up by the same factor as the impulse.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> You just decided the impulse got larger. Impulse is average force times duration — if the duration did not change, what happened to the force?"} },

  { id:"rider-g",
    lead:"<p>Same thought experiment: chair plus rider, same speed, same collision time.</p>",
    check:"Compared to the average g's the empty chair felt, the average g's felt by the rider would be…",
    choices:["About the same — the average force scaled up with the mass, but so does the weight it is divided by", "Larger — the impulse is larger, so the g's are larger", "Smaller — the rider's weight is spread over more of the chair", "Larger — the rider's weight adds to the force"],
    answer:0,
    feedback:"Right. Average force is $\\Delta(m\\dot{x})/\\Delta t$ and weight is $mg$, so average g's is $\\Delta\\dot{x}/(g\\,\\Delta t)$; the mass cancels. That is why the g's are the number that matters to a body: a heavier passenger in the same crash feels the same g's, and it is the g's that do the damage.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Write the g's as (average force)/(weight), then write each of those in terms of $m$. What happens to $m$?"} },

  { id:"crumple",
    matchY:true,
    slots:["sledA", "sledB"],
    lead:"<p>Suppose a car going 30 kph hits a wall. You saw in Test A that led to the sled experiencing 9 g's.</p>",

  { id:"head-replay",

  { id:"head-hic",
    checkKind:"hic2",
    matchY:true,
    slots:["headA", "headB"],
    lead:"<p><b>The real criterion.</b> The standard every car sold in the US must meet (FMVSS 208) uses the <b>Head Injury Criterion</b>: $$\\text{HIC}_{15}\\equiv\\Delta t\\times{(|\\ddot{\\underline{r}}|_{\\mathrm{avg}}/g})^{\\,2.5}\\le 700,$$where ${(|\\ddot{\\underline{r}}|_{\\mathrm{avg}}/g})^{\\,2.5}$ is the average g's on the head raised to the 2.5 power, and $\\Delta t$ is the time interval over which the average is taken, in seconds. The criterion specifies that the interval is no larger than 15 ms. Using the Average Value tool with a <b>15 ms</b> window centered on the peaks, compute $\\text{HIC}_{15}$, to the nearest whole number.</p>",
    check:"Do these two seats and belts pass?",
    choices:["A passes, B fails", "B passes, A fails", "Both fail", "Both pass"],
    answer:3,
    feedback:"Right — both are well under 700; a belted dummy at city speeds is nowhere near the limit. But notice the leverage in that 2.5 power: the criterion is built to punish sustained high g's, because that is what the brain tolerates least.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Compare each HIC15 to 700. Then compare the two HIC15s to each other — is the ratio what you expected from the ratio of the g's?", "empty": "Two boxes: for each head trace, the 15 ms average in g's, raised to the 2.5 power and multiplied by 0.015.", "dp": "HIC is a whole number, <b>no decimals</b>.", "low": "{label} looks too small — is the window on the <i>peak</i> of the trace, is the Signal on <b>Absolute acceleration</b>, and did you convert the average to g's before raising it to the 2.5 power?", "high": "{label} is too large — check the window width (about 0.015 s, not 0.15) and that the average went in as g's, not m/s².", "negative": "{label} is built from an average of a magnitude — it cannot be negative.", "check": "Not quite — {label}: {detail}"},
    inputs:[
      {label:"test A, HIC15", key:"hic_a", unit:"—", range:[0,5000], dp:0},
      {label:"test B, HIC15", key:"hic_b", unit:"—", range:[0,5000], dp:0} ] },

  { id:"crash-danger",
