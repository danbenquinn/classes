<script>
(function(){
  var RELEASE = 1789747200000;   // epoch ms, from the America/New_York wall clock at build time
  var done = false;
  function show(){
    if (done) return; done = true;
    var bin = atob(document.getElementById('deck').textContent), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    var html = new TextDecoder('utf-8').decode(u8);
    // MUST NOT run while the parser is still open. document.write() called during initial parsing
    // INSERTS at the parser's position instead of replacing the document, so the deck rendered below
    // the holding message, twice-titled, with two <body>s. Deferring by a tick puts us safely after
    // parsing, where open() truly clears and the result is an ordinary deck page.
    document.open(); document.write(html); document.close();
  }
  // `?preview` — Daniel's way in before the class. NOT a secret and not treated as one: anyone
  // holding this URL could already decode the payload below by hand, so the query string gives away
  // nothing the address bar did not. It exists because the author could not look at his own finished
  // deck, which is a silly reason to keep a gate. Deliberately NOT mentioned on the holding page.
  if (Date.now() >= RELEASE || /(^|[?&])preview($|[=&])/.test(location.search))
    return setTimeout(show, 0);
  document.getElementById('holding').hidden = false;
  try {
    // Pinned to the course's zone, and SAID so. Left to the viewer's locale this reads "4:00 PM" on a
    // laptop still set to UTC and "9:00 AM" in California — the same instant, described in a way that
    // matches neither the syllabus nor anything a student has been told.
    document.getElementById('when').textContent = 'Available ' +
      new Date(RELEASE).toLocaleString('en-US', { timeZone: 'America/New_York', weekday: 'long',
        month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' Eastern';
  } catch (e) {}
  // Re-check while the tab sits open, so a page opened before class becomes the deck at noon with
  // nobody reloading. Cheap, and the alternative is a student staring at a stale holding page.
  setInterval(function(){ if (Date.now() >= RELEASE) show(); }, 15000);
})();
</script>
