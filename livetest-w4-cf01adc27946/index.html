  { id:"mission",
    top:"html",
    html:"<div class='bigeq'><span class='kicker'>Today's mission</span>Measure how fast four springs ring, and how fast they die:<br>a ruler, a skyscraper, your arm, and a knee.</div>",
    lead:"" },

  { id:"model",
    top:"html",
    html:"<div class='bigeq'><span class='kicker'>One model for all four</span>$\\displaystyle x=e^{-\\zeta\\omega t}\\big[c_1\\sin+c_2\\cos\\big]\\!\\left(\\omega\\sqrt{1-\\zeta^2}\\,t\\right)$</div>",
    lead:"<p>This is Class L's damped spring, the solution of $m\\ddot{x}+\\alpha\\dot{x}+kx=0$. Two numbers describe everything you will measure today: $\\omega$ sets how fast the system <b>rings</b>, and $\\zeta$ sets how fast the ringing <b>dies</b>.</p><p>The analyzer has a new tool for it, <b>Fit Damped</b>. Drag across a stretch of ringing and it finds the $\\omega$ and $\\zeta$ whose curve lies closest to your data.</p>",
    check:"Two springs ring at the same $\\omega$. One has $\\zeta=0.01$, the other $\\zeta=0.1$. Which one is still ringing after ten swings?",
    choices:["The one with $\\zeta=0.1$, because more damping means a longer, slower response", "The one with $\\zeta=0.01$: its envelope $e^{-\\zeta\\omega t}$ shrinks ten times more slowly", "Both, equally, because they ring at the same frequency", "Neither: damping stops any spring within a few swings"],
    answer:1,
    feedback:"Right. $\\zeta$ sits in the exponent next to $\\omega$, so at the same $\\omega$ a tenth of the damping ratio buys ten times as long a ring.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Find $\\zeta$ in the model above. Which part of the curve does it control: how fast it wiggles, or how fast the wiggles shrink?"} },

  { id:"c-capture",
    gate:"data",
    requireAxis:"z",
    slots:["main"],
    live:{ slots:["main"] },
    lead:"<p><b>Part 1: a ruler.</b> Build a cantilever: a spring you can make on a desk.</p><ol><li>Clamp a meter stick to the edge of the desk with about <b>half a meter</b> hanging off. Pin it hard: a clamp, or a stack of heavy books with a hand on top.</li><li>Scan the code on the right with the phone you'll use, and tap <b>Connect</b>.</li><li>Tape that phone <b>flat at the tip, screen up</b>, with the tape all the way around the stick. A phone that rattles makes its own signal.</li><li>Press <b>Begin</b>. Hold still for two seconds, then press the tip down <b>about 2 cm</b> and let go cleanly.</li><li>Let it ring until you can't see it move, then press <b>Stop</b>. A clean ring-down? <b>Accept</b> it. If not, <b>Try again</b>.</li></ol><p class=\"aside\">Press, don't flick. A clean release from rest is the experiment Class L solved: no push once the spring is let go. The <b>Signal</b> is locked to $\\ddot{z}$: with the phone flat on the stick, $z$ points up and down, the way the tip moves.</p>",
    feedbackWhen:{"data": "Nothing kept yet. Record a ring-down, press <b>Stop</b>, then <b>Accept</b>."} },

  { id:"c-window",
    slots:["main"],
    lead:"<p>Before you fit, decide <b>which part of the trace the model describes</b>.</p>",
    check:"Which window should Fit Damped get?",
    choices:["The whole recording, start to finish", "From the first peak after you let go, to where the swing sinks into the noise", "Only the first cycle, where the signal is biggest", "The flat stretch before the release, where nothing is moving"],
    answer:1,
    feedback:"Right. The model is a spring that has been let go and left alone. Before the release your hand was pushing; after the ringing dies there is nothing left but sensor noise, and a fit spends its effort on whatever you give it.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> The model assumes nothing is pushing on the spring. When during your recording was that true, and when could you still see the ringing?"} },

    feedback:"That is your ruler: a few rings per second, and a $\\zeta$ of a percent or two. Lightly damped, like most things made of one solid piece.",

    inputs:[

      {label:"effective stiffness $k$", key:"c_k", unit:"N/m", range:[1, 100000], dp:0} ] },

  { id:"c-cycles",
    slots:["main"],
    lead:"<p>Class L's homework called $1/(\\zeta\\omega)$ the time for the swing to shrink by a factor of $e$.</p>",
    check:"Roughly how many <b>swings</b> fit into that time?",
    choices:["About $\\omega/\\zeta$", "About $1/(2\\pi\\zeta)$, whatever $\\omega$ is", "About $2\\pi/\\omega$", "About $\\zeta\\omega$"],
    answer:1,
    feedback:"Right: the time is $1/(\\zeta\\omega)$, one swing takes $2\\pi/\\omega$, and the $\\omega$s cancel. $\\zeta$ alone says how many rings you get; $\\omega$ says how fast they go by. Your ruler's $\\zeta$ gives you dozens.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Divide the decay time $1/(\\zeta\\omega)$ by the time for one swing, $2\\pi/\\omega$. What is left?"} },

  { id:"eq-intro",
    top:"html",
    html:"<div class='bigeq'><span class='kicker'>17 October 1989 · 5:04 p.m.</span>The Loma Prieta earthquake,<br>98 km from the Transamerica Pyramid</div>",
    lead:"<p><b>Part 2: a skyscraper.</b> San Francisco's Transamerica Pyramid is 49 stories, and the US Geological Survey had put accelerometers in it: in the basement, on the 21st floor and on the 49th. When the Loma Prieta earthquake hit, they recorded the whole thing.</p><p>You'll look at two of them next: the <b>basement</b>, which moves with the ground, and the <b>49th floor</b>.</p>" },

  { id:"eq-traces",
    slots:["roof", "base"],
    matchY:true,
    preload:["roof", "base"],
    lead:"<p>Top: the 49th floor. Bottom: the basement. Both are horizontal acceleration along the same direction (about north–south), on the same scale.</p>",
    check:"Look at the last 30 seconds. The basement is nearly flat, and the 49th floor is still swinging. What is the top of the building doing?",
    choices:["Still being shaken by the earthquake, which only reached the top of the building later", "Ringing on its own: the ground has stopped pushing and the building is a spring that has been let go", "Swaying in the wind, which is unrelated to the earthquake", "Measuring noise: the 49th-floor instrument is less precise than the basement's"],
    answer:1,
    feedback:"Right. Once the basement goes quiet nothing is pushing the building any more, and what is left is a free ring-down, the same experiment as your ruler with 49 stories on it.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> The basement moves with the ground. If the ground has gone quiet, what is still pushing on the building, and what does a spring do when nothing pushes on it?"} },

  { id:"eq-fit",
    tool:"fitdamped",
    checkKind:"dampfit",
    slots:["roof"],
    lead:"<p><b>Fit the building.</b> With <b>Fit Damped</b>, drag across the 49th floor's last 30 seconds or so: from where the basement has gone quiet to the end of the record.</p>",
    feedback:"About one swing every three and a half seconds, and a $\\zeta$ in the same range as your ruler's.",
    feedbackWhen:{"fit": "Drag a window across the last 30 seconds with <b>Fit Damped</b> first.", "check": "{label}: that doesn't match the fit on screen ($\\omega$ = {w} rad/s, $\\zeta$ = {z}). Copy from the readout, or re-drag if you moved the window.", "empty": "Two boxes: $\\omega$ and $\\zeta$, from the readout.", "dp": "As the readout prints them: $\\omega$ to <b>2</b> decimal places, $\\zeta$ to <b>3</b>.", "low": "{label} is too low for this building. Does your window start after the strong shaking, around 25 to 30 s?", "high": "{label} is too high for this building. Make sure the window is on the <b>49th floor</b> plot and starts after the shaking, not inside it."},
    inputs:[
      {label:"building $\\omega$", key:"e_w", unit:"rad/s", range:[0.5, 10], dp:2},
      {label:"building $\\zeta$", key:"e_z", unit:"—", range:[0, 0.3], dp:3} ] },

  { id:"eq-hz",
    checkKind:"hz",
    slots:["roof"],
    lead:"<p>Structural engineers quote a building's natural frequency in <b>hertz</b>, cycles per second. Convert your $\\omega$.</p>",
    feedback:"The USGS analysis of this same record found <b>0.28 Hz</b> during the earthquake. That is your number, from a fit you dragged yourself.",
    feedbackWhen:{"empty": "$\\omega$ is radians per second, and one cycle is $2\\pi$ radians.", "dp": "Two decimal places, <b>exactly</b>.", "low": "{label} is too small. Divide $\\omega$ by $2\\pi$; don't multiply.", "high": "{label} is too large. Divide $\\omega$ by $2\\pi$; don't multiply.", "check": "Not quite: your $\\omega$ of {w} rad/s is {expected} Hz. One cycle is $2\\pi$ radians."},
    input:"building frequency $f$", key:"e_f", unit:"Hz", range:[0.01, 2], dp:2 },

  { id:"eq-soft",
    slots:["roof"],
    lead:"<p>The same USGS analysis found the building rang at <b>0.34 Hz</b> in small vibrations measured <i>before</i> the earthquake, at <b>0.28 Hz</b> during it, and back near 0.34 Hz afterwards.</p>",
    check:"If the building's mass didn't change, what happened to its effective $k$ during the shaking?",
    choices:["It rose by about 20%", "It dropped to about two-thirds of its usual value, and recovered afterwards", "It dropped by about 20%", "Nothing: frequency doesn't depend on $k$"],
    answer:1,
    feedback:"Right: $\\omega=\\sqrt{k/m}$, so $k$ goes as $\\omega^2$, and $(0.28/0.34)^2\\approx0.68$. During strong shaking, small cracks open and joints slip, and the building is genuinely softer while it lasts.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> $\\omega=\\sqrt{k/m}$. If $\\omega$ falls by a factor of $0.28/0.34$ and $m$ stays put, by what factor must $k$ have changed?"} },

  { id:"eq-zeta",
    slots:["roof"],
    lead:"<p>The USGS fit to the <b>whole</b> record, strong shaking included, gave $\\zeta\\approx0.049$; ambient vibration before the earthquake gave about $0.009$. Your tail-only fit is probably in between.</p>",
    check:"Why would the damping ratio depend on how hard the building is swinging?",
    choices:["It can't: $\\zeta$ is a constant of the model, so one of the measurements is wrong", "The damping is real friction inside the structure, and big swings rub and crack it more per cycle than small ones", "The basement instrument added damping to the 49th-floor record", "Air resistance is larger on a tall building"],
    answer:1,
    feedback:"Right. The model treats $\\zeta$ as a constant, and for small enough swings it nearly is. A real structure's damping comes from joints, cladding and cracks rubbing, and how much energy they take per cycle depends on how far they move. The model is a description of one regime, not a law of the building.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Where does a steel building's damping actually come from? It has no dashpot in it. What rubs, and does it rub more or less when the swing is bigger?"} },

  { id:"eq-ruler",
    slots:["roof"],
    lead:"<p>Your ruler and the building have damping ratios in the same range, yet the ruler stops in seconds and the building was still swinging a minute after the ground went quiet.</p>",
    check:"Why?",
    choices:["The building is heavier, and heavier things have less damping", "The decay time is $1/(\\zeta\\omega)$, and the building's $\\omega$ is far smaller", "The building has a larger $\\zeta$", "The earthquake kept pushing the building after the basement stopped moving"],
    answer:1,
    feedback:"Right. Similar $\\zeta$ means a similar number of swings, about $1/(2\\pi\\zeta)$ either way. But each of the building's swings takes about three and a half seconds, and each of the ruler's a fraction of one. Decay <i>time</i> runs on $\\zeta\\omega$, not on $\\zeta$ alone.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Write the decay time with both numbers in it. Which of the two is wildly different between a ruler and a skyscraper?"} },

  { id:"a-capture",
    gate:"data",
    requireAxis:"x",
    slots:["relaxed", "stiff"],
    live:{ slots:["relaxed", "stiff"] },
    lead:"<p><b>Part 3: your arm.</b> Hang your arm straight down and let it swing from the shoulder, and it rings like a pendulum. Gravity and your muscles make the spring; you'll measure it twice: relaxed, then braced.</p><ol><li>Scan the code on the right with your phone again, and tap <b>Connect</b>.</li><li>Wrap the phone to your <b>palm</b> with the bandage, screen against the palm, the top of the phone toward your fingertips. It must not wobble.</li><li>Stand with the arm hanging straight down and the <b>elbow locked</b>, completely relaxed.</li><li>Your partner presses <b>Begin</b>, then lifts your arm forward by the wrist, about a hand's width, holds it still for a second, and lets go.</li><li>Let it swing until it stops, then <b>Stop</b> and <b>Accept</b>. That is the <b>relaxed</b> run, in the top plot.</li><li>Do it again, but this time <b>brace your shoulder</b>, tightening the muscles as if you were about to be shoved, and keep the elbow locked. That is the <b>braced</b> run, in the bottom plot.</li></ol><p class=\"aside\">Let go, don't push. The partner's job is a clean release from rest. The <b>Signal</b> is locked to $\\ddot{x}$: with the phone along your hand, $x$ points the way your hand swings. The acceleration rings with the same $\\omega$ and $\\zeta$ as the arm's angle, just as the ruler's acceleration did.</p>",
    feedbackWhen:{"data": "Keep a run in <b>each</b> plot: relaxed on top, braced below."} },

  { id:"a-fit-relaxed",
    tool:"fitdamped",
    checkKind:"dampfit",
    slots:["relaxed"],
    lead:"<p><b>Fit the relaxed swing.</b> Drag from the first peak after the release to where the swing fades.</p>",
    feedback:"That is a relaxed arm as a damped spring: roughly one swing a second, and much more damping than the ruler.",
    feedbackWhen:{"fit": "Drag a window across the swing with <b>Fit Damped</b> first.", "check": "{label}: that doesn't match the fit on screen ($\\omega$ = {w} rad/s, $\\zeta$ = {z}). Copy from the readout, or re-drag if you moved the window.", "empty": "Two boxes: $\\omega$ and $\\zeta$, from the readout.", "dp": "As the readout prints them: $\\omega$ to <b>2</b> decimal places, $\\zeta$ to <b>3</b>.", "low": "{label} is too low for an arm. Is the Signal on the gyroscope's $x$, and does your window start after the release?", "high": "{label} is too high for an arm. Did the window catch the release itself, or a wobble of the phone in its wrap?"},
    inputs:[
      {label:"relaxed $\\omega$", key:"a_w", unit:"rad/s", range:[1, 40], dp:2},
      {label:"relaxed $\\zeta$", key:"a_z", unit:"—", range:[0, 0.95], dp:3} ] },

  { id:"a-fit-stiff",
    tool:"fitdamped",
    checkKind:"dampfit",
    slots:["stiff"],
    lead:"<p><b>Now the braced swing.</b> Same thing, on the bottom plot.</p>",

    inputs:[

      {label:"braced $\\zeta$", key:"s_z", unit:"—", range:[0, 0.95], dp:3} ] },

  { id:"a-compare",
    slots:["relaxed", "stiff"],
    lead:"<p>Bracing changes what your muscles add to the spring.</p><p class=\"aside\">Lipps et al., <i>Annals of Biomedical Engineering</i> 48 (2020), measured shoulder stiffness and damping with a robot while participants braced.</p>",
    check:"What did bracing your shoulder do to the spring?",
    choices:["Nothing: the arm's mass and length didn't change, so neither did the swing", "Only $\\zeta$ changed, because muscles can only absorb energy", "The effective $k$ went up, so $\\omega$ rose, and the damping changed too", "$\\omega$ dropped, because tense muscles are heavier"],
    answer:2,
    feedback:"Right, and that is what researchers find when they shake a shoulder with a robot: bracing raises the joint's effective stiffness and its damping together, and $\\zeta$ lands between about 0.2 and 0.4. Your arm is a spring whose constants you can change by thinking about it.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Gravity, the arm's mass and its length were the same both times. What else is acting as the spring, and what did you change about it?"} },

  { id:"k-intro",
    figure:"media/knee-fig2a.png",
    slots:["kneeH", "kneeS"],

    attribution:"De Santis & Perez, J NeuroEng Rehabil 21:50 (2024) · CC BY 4.0",
    source:"https://doi.org/10.1186/s12984-024-01326-9",
    lead:"<p><b>Part 4: a knee.</b> Doctors run your arm experiment on legs. In the <b>pendulum test</b> the patient sits on the edge of a table, the examiner lifts the lower leg straight out, and lets go. A healthy leg swings back and forth several times; a leg with <b>spasticity</b>, muscles that over-react to being stretched after a spinal cord injury or a stroke, stops short.</p><p>The figure is from a 2024 study: a healthy participant (top), a participant with a spinal cord injury but no spasticity (middle), and one with spasticity (bottom). Black is motion capture; orange, a pair of IMUs like the one in your phone. The plots above are the healthy (top) and spastic (bottom) motion-capture traces, read straight out of the paper's figures.</p>" },

  { id:"k-model",
    slots:["kneeH", "kneeS"],
    matchY:true,
    lead:"",
    check:"The spastic leg's first swing stopped near $-50^\\circ$ instead of $-125^\\circ$ and bounced back. Why can't one damped spring describe that swing?",
    choices:["It can; the spastic leg just has a much larger $\\zeta$", "The leg is heavier after a spinal cord injury", "A reflex switched on partway through the swing: the muscle's stiffness and damping changed mid-motion, so the model's constants weren't constant", "The motion-capture markers slipped"],
