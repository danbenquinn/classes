    lead:"<p>Anything warmer or colder than its surroundings closes the gap exponentially. The time constant is $\\tau=\\dfrac{\\text{heat stored per kelvin}}{\\text{heat passed per kelvin}}$: how much heat it takes to change the object's temperature by one kelvin, divided by how much heat crosses to the surroundings each second for every kelvin of difference.</p>",

    lead:"<p><b>Fit it.</b> These are the engineers' eleven readings: the pack's temperature $T$ against time, in minutes. With <b>Fit Exponential</b>, drag across all of them. The green curve is the best-fit exponential; read its plateau and its $\\tau$ off the fitted function, each to 1 decimal place.</p><p class=\"aside\">The fit is $T\\approx T_\\text{plateau}-A\\,e^{-t/\\tau}$: the plateau is the first number, and $\\tau$ is the number under $t$.</p>",
    feedback:"A plateau a little under 50 °C, and a time constant of about a quarter of an hour.",
    feedbackWhen:{"fit": "Drag a window across all eleven points with <b>Fit Exponential</b> first; the fitted function appears in the readout.", "check": "{label} doesn't match the function on screen. {hint}", "empty": "Two boxes: the plateau (the first number in the fitted function) and $\\tau$ (the number under $t$).", "dp": "One decimal place for each.", "low": "{label} is low for this pack. Does your window cover all eleven points?", "high": "{label} is high for this pack. Does your window cover all eleven points?"},
    inputs:[
      {label:"plateau temperature", key:"b_T", unit:"°C", range:[30, 70], dp:1},
      {label:"battery's $\\tau$", key:"b_tau", unit:"min", range:[5, 40], dp:1} ] },

  { id:"b-passed",
    checkKind:"calc",
    slots:["batt"],
    lead:"<p><b>The heat passed per kelvin.</b> At the plateau the pack's temperature has stopped changing, so all 23.5 W from the heater is leaking out to the chamber. The chamber is at $-10$ °C. How many watts leak for each kelvin the pack sits above the chamber? Two decimal places.</p>",
    feedback:"About 0.4 W for every kelvin of difference. That is the bottom of the fraction.",
    feedbackWhen:{"empty": "One box: 23.5 W divided by how far the plateau sits above the chamber.", "dp": "Two decimal places.", "check": "Not quite. {hint} With your plateau, it comes to {expected} W/K."},
    input:"heat passed per kelvin", key:"b_G", unit:"W/K", range:[0.1, 2], dp:2 },

  { id:"b-stored",
    checkKind:"calc",
    slots:["batt"],
    lead:"<p><b>The heat stored per kelvin.</b> $\\tau$ = (heat stored per kelvin)/(heat passed per kelvin), and you now have $\\tau$ and the bottom. Find the top, in joules per kelvin, to the nearest whole number.</p>",
    feedback:"About 400 J for every kelvin. You just measured how much heat a battery pack holds, from a temperature log and the heater's wattage.",
    feedbackWhen:{"empty": "One box: $\\tau$ times the heat passed per kelvin. Mind the units of $\\tau$.", "dp": "A whole number of J/K, <b>no decimals</b>.", "low": "{label} is too small. A watt is a joule per second, and your $\\tau$ is in minutes.", "check": "Not quite. {hint} With your numbers, it comes to {expected} J/K."},
    input:"heat stored per kelvin", key:"b_C", unit:"J/K", range:[50, 2000], dp:0 },

  { id:"b-rate",
    slots:["batt"],
    lead:"<p>Newton's cooling says more than \"it is an exponential.\" At every moment, the temperature is changing at a rate of (the gap that is left)/$\\tau$: $$\\text{rate of warming}=\\frac{T_\\text{plateau}-T}{\\tau}$$</p>",
    check:"Suppose most of the log had been lost. Which scraps of it would still be enough to find $\\tau$?",
    choices:["The starting temperature alone", "How fast the pack was warming at one moment, and nothing else", "The plateau, plus the pack's temperature at one moment and how fast it was warming just then", "Nothing short of the whole curve"],
    answer:2,
    feedback:"Right. A gap and a rate, at one moment, give $\\tau$ = gap/rate. One point and one slope pin down the whole exponential.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Rate of warming = gap/$\\tau$. Which quantities do you need to know to solve that for $\\tau$?"} },

  { id:"b-point",
    tool:"slope",
    checkKind:"calc",
    slots:["batt"],
    lead:"<p><b>Try it.</b> Pretend all you have is the stretch from 5 to 15 minutes. With <b>Slope</b>, drag from 5 min to 15 min: that is how fast the pack was warming, in °C per minute. With <b>Select Point</b>, read the temperature in the middle of that stretch, at 10 min. Then find $\\tau$ from the gap and the rate, to 1 decimal place.</p>",
    feedback:"About 16 minutes again, from a tenth of the log. That is the trick you'll need for the spoon.",
    feedbackWhen:{"empty": "Three boxes: the slope from 5 to 15 min, the temperature at 10 min, and $\\tau$ = (plateau − temperature)/slope.", "dp": "The slope and $\\tau$ to 1 decimal place; the temperature to the nearest degree.", "low": "{label} is low. Drag <b>Slope</b> from 5 min to 15 min, and read the point at 10 min.", "high": "{label} is high. Drag <b>Slope</b> from 5 min to 15 min, and read the point at 10 min.", "check": "Not quite. {hint} With your numbers, (plateau − temperature)/slope comes to {expected} min."},
    inputs:[
      {label:"rate of warming, 5 to 15 min", key:"b_sl", unit:"°C/min", range:[1, 3], dp:1},
      {label:"temperature at 10 min", key:"b_Tm", unit:"°C", range:[10, 22], dp:0},
      {label:"$\\tau$ from one point and one slope", key:"b_tau2", unit:"min", range:[5, 40], dp:1} ] },

  { id:"b-fan",
    slots:["batt"],
    lead:"",
    check:"Suppose the chamber had a fan blowing across the pack, heater still at 23.5 W. Compared with this run, the pack's plateau and its $\\tau$ would be…",
    choices:["Higher plateau, longer $\\tau$", "The same plateau, shorter $\\tau$", "Lower plateau, shorter $\\tau$: more heat passed per kelvin, the same heat stored", "Lower plateau, the same $\\tau$"],
    answer:2,
    feedback:"Right. More heat passed per kelvin shortens $\\tau$. It also lowers the plateau, because 23.5 W now leaks out at a smaller temperature difference. You'll blow on something yourself in a few minutes.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> At the plateau, 23.5 W leaks out. If each kelvin of difference now leaks more, how many kelvins does it take? And which half of $\\tau$ changed?"} },

  { id:"s-mass",
    checkKind:"calc",
    lead:"<p><b>Part 2: A spoon.</b> Your spoon is about to come out of ice water at 0 °C and warm back up to the room, at about 21 °C. First: how much heat does that take?</p><ol><li>Weigh your dry spoon on the kitchen scale, to a tenth of a gram.</li><li>Take the plastic's specific heat as $c_p=1.9$ J/(g·K), and find the heat the spoon stores per kelvin, $m\\,c_p$, to 1 decimal place.</li><li>Find the heat it must take in to warm from 0 °C to 21 °C, $\\Delta Q=m\\,c_p\\,\\Delta T$, to the nearest joule.</li></ol>",
    feedback:"That many joules have to cross from the room's air into the spoon. The rest of Part 2 is about how fast they do.",
    feedbackWhen:{"empty": "Three boxes: the mass, then $m\\,c_p$, then $m\\,c_p\\times 21$ K.", "dp": "Mass and J/K to 1 decimal place; joules to the nearest whole number.", "check": "Not quite. {hint} With your numbers, it comes to {expected}."},
    inputs:[
      {label:"spoon's mass $m$", key:"s_m", unit:"g", range:[1, 15], dp:1},
      {label:"heat stored per kelvin", key:"s_C", unit:"J/K", range:[1, 40], dp:1},
      {label:"heat to warm it from 0 °C to 21 °C", key:"s_Q", unit:"J", range:[1, 700], dp:0} ] },

  { id:"s-idea",
    top:"html",
    html:"<div class='bigeq'><span class='kicker'>The spoon is its own thermometer, for five degrees</span>cold color below about 12 °C<br>warm color above about 17 °C</div>",
    lead:"<p>Your spoon changes color as it warms through a band of about 5 °C, from about 12 °C to about 17 °C. Below the band it stays its cold color; above it, its warm color. A phone will watch it and plot the color: 0 is the cold color, 1 is the warm color.</p>",
    check:"The color only moves while the spoon is between about 12 °C and 17 °C. How can that be enough to find the spoon's $\\tau$ for the whole warm-up?",
    choices:["It isn't: you would need a thermometer on the spoon from start to finish", "Inside the band the color tells you a temperature and how fast it is rising. With the room's temperature as the plateau, that is one point and one slope", "The time the color takes to cross the band is $\\tau$", "Color and temperature are the same thing, so the color curve is the temperature curve"],
    answer:1,
    feedback:"Right, and it is what you just did with ten minutes of the battery's log. If the color climbs by 0.2 of the way in a minute, the spoon is warming at about $0.2\\times5$ °C $=1$ °C per minute while it does. It is a rough thermometer, so expect a rough $\\tau$.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> On the battery, which three things gave you $\\tau$ without the whole curve? Which of them can the spoon's color give you, and which do you already know?"} },

  { id:"s-setup",
    top:"html",
    cam:{ warm:true },
    html:"<div class='sc-stage'><canvas id='sc-live'></canvas></div>",
    lead:"<p><b>Set up the camera.</b></p><ol><li>Tape the printed sheet flat on the table.</li><li>Scan the QR code with the phone that will be the camera, and tap <b>Start camera</b>.</li><li>Prop the phone so it looks at the sheet from the end with squares <b>3</b> and <b>4</b>, at about 45°, with all four black squares in the picture.</li><li>Lay your <b>warm, dry</b> spoon on the outline, bowl toward squares 3 and 4.</li><li>The phone's picture appears above. When the blue outline sits on the printed one, press <b>Save warm color</b>.</li></ol><p class=\"aside\">From here on, don't move the phone or the sheet. If either gets bumped, come back to this step and save the warm color again.</p>" },

  { id:"s-control",
    gate:"data",
    requireAxis:"bowl",
    slots:["ctl"],
    cam:{ slots:["ctl"], seconds:150, until:0.35, untilCols:["Bowl", "Handle"], go:true },
    lead:"<p><b>The control run.</b> Nothing changed: a cold spoon, on paper, in still air.</p><ol><li>Dunk the spoon in ice water for about 20 seconds.</li><li>Pat it dry. Hold it only by the very end of the handle.</li><li>Lay it on the outline and get your hand out of the picture.</li><li>Press <b>Record</b>. The deck stops by itself once the color has climbed through the shaded band: a minute or two.</li><li>Press <b>Next</b>: there is a question to answer while it records.</li></ol><p class=\"aside\">The plot shows three places on the spoon at once: the bowl, the handle and the tip. The shaded band, from 0.1 to 0.3, is where you'll measure: the spoon is at about 13 °C there.</p>",
    feedbackWhen:{"data": "Nothing recorded yet. Lay the cold spoon on the outline and press <b>Record</b>."} },

  { id:"s-control-q",
    requireAxis:"bowl",
    slots:["ctl"],
    cam:{ slots:["ctl"], seconds:150, until:0.35, untilCols:["Bowl", "Handle"], watch:true, hold:true },
    lead:"<p><b>While it records.</b> Watch the three curves: the <b>bowl</b>, the <b>handle</b> and the <b>tip</b> of the same spoon, in the same still air.</p>",
    check:"If one of the three warms more slowly than the others, what is the most likely reason?",
    choices:["It started out colder than the others", "There is more plastic behind each bit of its surface: more heat stored per kelvin, and the same air to pass it", "The air around that part of the spoon is colder", "The camera reads color less accurately there"],
    answer:1,
    feedback:"Right. The same air touches all three, so each bit of surface is passed about the same heat per kelvin. What differs along a spoon is how much plastic that surface has to warm. When the run finishes, <b>Accept</b> it if it rose smoothly; if a hand or a shadow got in, <b>Try again</b> with a freshly cooled spoon.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> $\\tau$ = (heat stored per kelvin)/(heat passed per kelvin). All three places feel the same air. Which half of the fraction can still differ from place to place?"} },

  { id:"s-slope-control",
    tool:"slope",
    checkKind:"slopefit",
    requireAxis:"bowl",
    slots:["ctl"],
    lead:"<p><b>The bowl's slope.</b> The heavy line is the bowl. With <b>Slope</b>, drag across the stretch where it climbs through the shaded band, from 0.1 to 0.3. Type the slope the readout gives, in color per minute.</p>",
    feedback:"That is how fast the bowl's color was moving as it passed about 13 °C.",
    feedbackWhen:{"fit": "Drag a window across the shaded stretch with <b>Slope</b> first; the slope appears in the readout.", "check": "{label} doesn't match the slope on screen. Type the number the readout shows.", "empty": "One box: the slope, from the Slope readout.", "low": "{label} is too small for a bare spoon in room air. Is your window on the stretch inside the shaded band?", "high": "{label} is too large. Is your window on the stretch inside the shaded band, after your hand was out of the picture?"},
    input:"control's slope, bowl", key:"s_sl", unit:"per min", range:[0.02, 5] },

  { id:"s-tau",
    checkKind:"calc",
    requireAxis:"bowl",
    slots:["ctl"],
    lead:"<p><b>One point and one slope.</b> The whole band, 0 to 1, is about 5 °C, so the color's slope times 5 °C is how fast the bowl was warming. The middle of the shaded stretch, 0.2, is about 13 °C, and the room is at about 21 °C. Find the rate of warming, to 1 decimal place, and then the spoon's $\\tau$ = gap/rate, to 1 decimal place.</p>",
    feedback:"A few minutes, most likely. From a short stretch of color you have an estimate of how the spoon warms from 0 °C all the way to the room.",
    feedbackWhen:{"empty": "Two boxes: 5 °C × your slope, then (21 − 13) °C divided by that rate.", "dp": "One decimal place for each.", "check": "Not quite. {hint} With your numbers, it comes to {expected}."},
    inputs:[
      {label:"rate of warming at about 13 °C", key:"s_rate", unit:"°C/min", range:[0.1, 25], dp:1},
      {label:"spoon's $\\tau$, a rough estimate", key:"s_tau", unit:"min", range:[0.2, 60], dp:1} ] },

  { id:"s-watts",
    checkKind:"calc",
    requireAxis:"bowl",
    slots:["ctl"],
    lead:"<p><b>Back to the joules.</b> You know the heat your spoon stores per kelvin, and now its $\\tau$. Find the heat the air passes to it per kelvin, to 3 decimal places. Then: just out of the ice water, the spoon is 21 K below the room. How many watts flow into it at that moment? Two decimal places.</p><p class=\"aside\">This treats the whole spoon as warming the way its bowl does. It is an estimate.</p>",
    feedback:"Divide the joules you worked out at the start by that many watts: you get $\\tau$ back. A time constant is how long the warm-up would take if the heat kept pouring in at its starting rate. It doesn't, because the gap shrinks, and that is the exponential.",
    feedbackWhen:{"empty": "Two boxes: (heat stored per kelvin)/$\\tau$, with $\\tau$ in seconds; then that times 21 K.", "dp": "Three decimal places for W/K, two for W.", "check": "Not quite. {hint} With your numbers, it comes to {expected}."},
    inputs:[
      {label:"heat passed per kelvin", key:"s_G", unit:"W/K", range:[0.001, 50], dp:3},
      {label:"heat flow at the start", key:"s_P", unit:"W", range:[0.02, 1000], dp:2} ] },

  { id:"s-slope-handle",
    tool:"slope",
    checkKind:"slopefit",
    requireAxis:"handle",
    slots:["ctl"],
    fitSlot:"ctl",
    autofill:true,
    lead:"<p><b>The handle's slope.</b> The heavy line has switched to the handle. Drag <b>Slope</b> across its climb through the shaded band. You typed the slope once; from here on, the deck fills it in.</p>",
    feedback:"Compare it with the bowl's. A smaller slope at the same color means a longer $\\tau$: on our test spoon the handle warmed about half as fast as the bowl. The same air, more plastic to warm.",
    feedbackWhen:{"fit": "Drag a window across the handle's climb through the shaded band with <b>Slope</b> first.", "empty": "Drag a window with <b>Slope</b>; the box fills in from it."},
    input:"control's slope, handle", key:"s_sl_h", unit:"per min", range:[0.01, 5] },

  { id:"s-blow",
    gate:"data",
    requireAxis:"bowl",
    slots:["ctl", "blow"],
    cam:{ slots:["blow"], seconds:90, until:0.35 },
    matchX:true,
    lead:"<p><b>Test 1: blow on it.</b> Cool the spoon, pat it dry, lay it on the outline, and press <b>Record</b>. Then blow gently and steadily across the spoon from the side, without leaning into the picture. Take turns. The deck stops by itself, well inside a minute and a half.</p>",
    feedbackWhen:{"data": "Nothing kept yet. Record the run, wait for it to finish, then <b>Accept</b>."} },

  { id:"s-slope-blow",
    tool:"slope",
    checkKind:"slopefit",
    requireAxis:"bowl",
    slots:["ctl", "blow"],
    fitSlot:"blow",
    matchX:true,
    autofill:true,
    lead:"<p><b>The bottom plot</b>, the run you blew on: drag <b>Slope</b> across the bowl's climb through the shaded band.</p>",
    feedback:"Several times steeper than the control, most likely.",
    feedbackWhen:{"fit": "Drag a window across the shaded stretch of the <b>bottom</b> plot with <b>Slope</b> first.", "empty": "Drag a window on the bottom plot with <b>Slope</b>; the box fills in from it."},
    input:"blown-on slope, bowl", key:"s_sl_blow", unit:"per min", range:[0.02, 30] },

  { id:"s-blow-why",
    requireAxis:"bowl",
    slots:["ctl", "blow"],
    matchX:true,
    leadFn:a=>{
      // rough tau = (21 - 13) °C / (5 °C x slope) = 1.6/slope, in minutes: CONFIG.spoon holds the three numbers
      const K=CONFIG.spoon, tau=v=>(Number.isFinite(v)&&v>0)?((K.room-K.at)/(K.band*v)).toFixed(1):"—", n=v=>Number.isFinite(v)?String(v):"—";
      const r=(Number.isFinite(a.s_sl)&&Number.isFinite(a.s_sl_blow)&&a.s_sl>0)?(a.s_sl_blow/a.s_sl).toFixed(1):"—";
      return "<p>Your two runs, at the bowl, by the same arithmetic as before:</p><ul><li>Control: slope <b>"+n(a.s_sl)+"</b> per min &nbsp;·&nbsp; $\\tau$ about <b>"+tau(a.s_sl)+"</b> min</li><li>Blown on: slope <b>"+n(a.s_sl_blow)+"</b> per min &nbsp;·&nbsp; $\\tau$ about <b>"+tau(a.s_sl_blow)+"</b> min &nbsp;·&nbsp; <b>"+r+"</b> times faster</li></ul>";
    },
    check:"Which part of $\\tau$ did blowing change?",
    choices:["The heat stored per kelvin went down: the spoon got lighter", "The heat passed per kelvin went up: moving air carries heat to the spoon faster than still air", "Both went up by the same factor", "Neither: your breath is warm, and that is the whole effect"],
    answer:1,
    feedback:"Right. The spoon is the same spoon, so it stores the same heat per kelvin. Moving air passes more heat per kelvin, and $\\tau$ drops. Your breath is also warm and humid, which helps a little more: a fast knob, not a clean one.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Is it the same spoon? Then which half of the fraction is left to change?"} },

  { id:"s-metal",
    gate:"data",
    requireAxis:"bowl",
    slots:["ctl", "metal"],
    cam:{ slots:["metal"], seconds:300, until:0.35, go:true },
    matchX:true,
    lead:"<p><b>Test 2: a cold metal spoon underneath.</b></p><ol><li>Take a metal spoon from the ice, dry it, and lay it on the outline.</li><li>Cool your plastic spoon, pat it dry, and nest it on top of the metal one.</li><li>Hands out, then <b>Record</b>. This run takes up to five minutes.</li><li>Press <b>Next</b>: there are three questions to answer while it records.</li></ol>",
    feedbackWhen:{"data": "Nothing recorded yet. Nest the two cold spoons on the outline and press <b>Record</b>."} },

  { id:"s-metal-q1",
    requireAxis:"bowl",
    slots:["ctl", "metal"],
    cam:{ slots:["metal"], seconds:300, until:0.35, watch:true },
    matchX:true,
    lead:"<p><b>While it records.</b> The plastic spoon is lying on a metal spoon that is just as cold as it is.</p>",
    check:"Should the plastic spoon take longer to warm up than it did on its own?",
    choices:["No, it should be quicker: metal conducts heat well, so it feeds heat to the plastic", "No, about the same: the same still air is doing the warming", "Yes: the air now has to warm the cold metal too, and the plastic can't get ahead of the metal it is touching", "It depends on what metal the spoon is made of"],
    answer:2,

    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Where does the heat that warms the spoon come from? Does the metal spoon have any to give?"} },

  { id:"s-metal-q2",
    requireAxis:"bowl",
    slots:["ctl", "metal"],
    cam:{ slots:["metal"], seconds:300, until:0.35, watch:true },
    matchX:true,
    lead:"",
    check:"Which part of $\\tau$ does the metal spoon change?",
    choices:["The heat stored per kelvin goes up: the metal has to warm too, and it holds far more heat per kelvin than the thin plastic", "The heat passed per kelvin goes up: metal conducts heat well", "The heat passed per kelvin goes down: the metal blocks the air", "Neither: the metal spoon only changes the starting temperature"],
    answer:0,
    feedback:"Right. The same air, with more to warm: the top of the fraction grows, and $\\tau$ with it. More joules to pour in, through the same tap.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> The room's still air is what warms the pair. What does it now have to warm that it didn't before?"} },

  { id:"s-metal-q3",
    requireAxis:"bowl",
    slots:["ctl", "metal"],
    cam:{ slots:["metal"], seconds:300, until:0.35, watch:true, hold:true },
    matchX:true,
    lead:"",
    check:"The metal spoon lies under the whole plastic spoon. Which of the three curves should it slow down?",
    choices:["Only the bowl, where the two spoons fit together best", "Only the handle, the thickest part", "All three: wherever the plastic touches cold metal, there is more to warm", "None of them: the metal only matters after the plastic has warmed up"],
    answer:2,
    feedback:"Right. Check it against the bottom plot as the run finishes, then <b>Accept</b> the run.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Where along the plastic spoon is there extra cold metal to warm?"} },

  { id:"s-slope-metal",
    tool:"slope",
    checkKind:"slopefit",
    requireAxis:"bowl",
    slots:["ctl", "metal"],
    fitSlot:"metal",
    matchX:true,
    autofill:true,
    lead:"<p><b>The bottom plot</b>: drag <b>Slope</b> across the bowl's climb through the shaded band, or as much of the band as it got through.</p>",
    feedback:"Several times shallower than the control, most likely: the same color, the same temperature, a much slower climb.",
    feedbackWhen:{"fit": "Drag a window across the shaded stretch of the <b>bottom</b> plot with <b>Slope</b> first.", "empty": "Drag a window on the bottom plot with <b>Slope</b>; the box fills in from it."},
    input:"on-metal slope, bowl", key:"s_sl_metal", unit:"per min", range:[0.005, 5] },

  { id:"s-drop",
    gate:"data",
    requireAxis:"bowl",
    slots:["ctl", "drop"],
    cam:{ slots:["drop"], seconds:300, until:0.35, go:true },
    matchX:true,
    lead:"<p><b>Test 3: a drop of cold water.</b></p><ol><li>Cool the spoon, pat it dry, and lay it on the outline.</li><li>With a straw or a fingertip, put <b>one drop</b> of ice water in the lowest point of the bowl.</li><li>Hands out, then <b>Record</b>. This run takes up to five minutes.</li><li>Press <b>Next</b>: there are three questions to answer while it records.</li></ol>",
    feedbackWhen:{"data": "Nothing recorded yet. Lay the cold spoon on the outline, add the drop, and press <b>Record</b>."} },

  { id:"s-drop-q1",
    requireAxis:"bowl",
    slots:["ctl", "drop"],
    cam:{ slots:["drop"], seconds:300, until:0.35, watch:true },
    matchX:true,
    lead:"<p><b>While it records.</b> One drop of ice water is sitting in the bowl.</p>",
    check:"Should the bowl take longer to warm up than it did in the control?",
    choices:["No, it should be quicker: water conducts heat better than air", "No, about the same: one drop is too little water to matter", "Yes: the air has to warm the water as well, and a drop of water stores far more heat per kelvin than the thin plastic under it", "Yes, but only because the drop hides the spoon's color from the camera"],
    answer:2,
    feedback:"Right. Water holds a great deal of heat per kelvin, and the drop is as cold as the spoon. Under it, there is much more to warm.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Compare a drop of water with the thin plastic it sits on. Which stores more heat per kelvin? Does the drop have any heat to give?"} },

  { id:"s-drop-q2",
    requireAxis:"bowl",
    slots:["ctl", "drop"],
    cam:{ slots:["drop"], seconds:300, until:0.35, watch:true },
    matchX:true,
    lead:"",
    check:"Should the handle take longer to warm up, too?",
    choices:["Yes: the spoon is one object, so it has one $\\tau$", "Yes: the drop cools the air around the whole spoon", "No: nothing was added there, so it stores the same heat per kelvin and feels the same air as before", "No: the handle was never cold in the first place"],
    answer:2,
    feedback:"Right. Watch the handle on the bottom plot: it should rise about as it did in the control, while the bowl lags. The tip, a couple of centimeters from the drop, may lag a little.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> What changed at the handle? Is anything new there for the air to warm?"} },

  { id:"s-drop-q3",
    requireAxis:"bowl",
    slots:["ctl", "drop"],
    cam:{ slots:["drop"], seconds:300, until:0.35, watch:true, hold:true },
    matchX:true,
    lead:"",

      const K=CONFIG.spoon, ok=(x,y)=>Number.isFinite(x)&&Number.isFinite(y)&&x>0&&y>0, n=v=>Number.isFinite(v)?String(v):"—";
