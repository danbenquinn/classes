    feedbackWhen:{"data": "Nothing kept yet. Record the control run, wait for it to finish, then <b>Accept</b>."} },

    answer:1,

    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> The two spoons change color over different temperature ranges. Which comparisons don't care about that?"} },

  { id:"s-fit-control",
    tool:"fitexp",
    checkKind:"expfit",
    requireAxis:"bowl",
    slots:["ctl"],
    lead:"<p><b>Fit it.</b> With <b>Fit Exponential</b>, drag across the whole run. The green curve is the best-fit exponential that heads for 1, the warm color. Read $\\tau$ off the fitted function, to the nearest second.</p><p class=\"aside\">The fit is $\\text{color}\\approx 1-A\\,e^{-t/\\tau}$. It is pinned to end at 1; only $A$ and $\\tau$ are fitted.</p>",
    feedback:"That is your control: a time constant of a minute or three. Every other run today gets compared with it.",
    feedbackWhen:{"fit": "Drag a window across the run with <b>Fit Exponential</b> first; the fitted function appears in the readout.", "check": "{label} doesn't match the function on screen. {hint}", "empty": "One box: $\\tau$, from the function in the Fit Exponential readout.", "dp": "Give $\\tau$ to the nearest second, <b>no decimals</b>.", "low": "{label} is shorter than a spoon on paper should give. Does your window cover the whole run?", "high": "{label} is longer than a spoon on paper should give. Does your window start where the curve starts to rise?"},
    input:"control's $\\tau$", key:"s_ctl", unit:"s", range:[20, 900], dp:0 },

    feedback:"Noted. Now measure it." },

  { id:"s-metal",
    gate:"data",
    requireAxis:"bowl",
    slots:["ctl", "metal"],
    cam:{ slots:["metal"], seconds:300 },
    matchX:true,
    lead:"<p><b>The metal spoon.</b> Take a metal spoon from the ice, dry it, and lay it on the outline. Cool your plastic spoon, pat it dry, and nest it on top of the metal one. Hands out, then <b>Record</b>. Five minutes.</p>",
    feedbackWhen:{"data": "Nothing kept yet. Record the run, wait for it to finish, then <b>Accept</b>."} },

    input:"on-metal $\\tau$", key:"s_metal", unit:"s", range:[30, 5000], dp:0 },

  { id:"s-metal-why",
    slots:["ctl", "metal"],
    matchX:true,
    leadFn:a=>{
      const n=v=>Number.isFinite(v)?v.toFixed(0):"—", r=(Number.isFinite(a.s_ctl)&&Number.isFinite(a.s_metal)&&a.s_ctl>0)?(a.s_metal/a.s_ctl).toFixed(1):"—";

    },
    check:"Which part of $\\tau$ did the metal spoon change?",
    choices:["The heat stored per kelvin went up: the cold metal has to warm up too, and it holds far more heat per kelvin than the thin plastic", "The heat passed per kelvin went up: metal conducts heat well", "The heat passed per kelvin went down: the metal blocks the air", "Neither: the metal spoon only changed the starting temperature"],
    answer:0,
    feedback:"Right. The air has to warm the plastic and the metal together, and the metal stores several times more heat per kelvin. Same air, more to warm, longer $\\tau$.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> The room's still air is what warms the pair. What does it now have to warm that it didn't before?"} },

  { id:"s-drop-predict",

    check:"Predict: compared with the control…",
    choices:["The bowl and the tip both warm more slowly", "The bowl warms more slowly; the tip warms about as it did before", "The bowl warms faster, because water conducts heat better than air", "Nothing changes: one drop is too little water to matter"],

    feedbackWhen:{"fit": "Drag a window across the <b>bottom</b> plot with <b>Fit Exponential</b> first.", "empty": "Drag a window on the bottom plot with <b>Fit Exponential</b>; the box fills in from the fit."},
    input:"tip $\\tau$ with the drop", key:"s_tip_drop", unit:"s", range:[5, 900], dp:0 },

  { id:"s-compare",
    requireAxis:"bowl",
    slots:["ctl", "drop"],
    matchX:true,
    leadFn:a=>{
      // the Part 1 punch line: the group's own four bowl τ, each against the control, and the two tip τ
      const n=v=>Number.isFinite(v)?v.toFixed(0):"—", ok=(x,y)=>Number.isFinite(x)&&Number.isFinite(y)&&x>0&&y>0;
      const rel=(v,c)=>!ok(v,c)?"—":(v>=c?(v/c).toFixed(1)+" times slower":(c/v).toFixed(1)+" times faster");
      const li=(name,v,c)=>"<li>"+name+": $\\tau$ = <b>"+n(v)+"</b> s"+(c===undefined?"":" &nbsp;·&nbsp; <b>"+rel(v,c)+"</b>")+"</li>";
      return "<p>Your spoon, four ways. At the <b>bowl</b>:</p><ul>"+li("Control",a.s_ctl)+li("Blown on",a.s_blow,a.s_ctl)+li("On a cold metal spoon",a.s_metal,a.s_ctl)+li("Under a water drop",a.s_drop,a.s_ctl)+"</ul>"
        +"<p>At the <b>tip</b>:</p><ul>"+li("Control",a.s_tip_ctl)+li("With the drop in the bowl",a.s_tip_drop,a.s_tip_ctl)+"</ul>";
    },
    check:"The metal spoon slowed the whole spoon. The drop slowed the bowl and left the tip alone. Why?",
    choices:["Water blocks the air from reaching the bowl, and the tip is still exposed", "The drop adds heat stored per kelvin only where it sits; the tip stores what it always did and feels the same air", "The tip is thinner, so it was never cold", "The drop cools the bowl by evaporating, and evaporation doesn't reach the tip"],
    answer:1,
    feedback:"Right. Extra storage slows only the place that has to warm it. The metal spoon touched the whole spoon; the drop touches one spot. That is $\\tau$ = (heat stored per kelvin)/(heat passed per kelvin), working point by point.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> What does the bowl have to warm now that the tip doesn't? Did anything about the air around the tip change?"} },

  { id:"b-intro",
    top:"html",
    attribution:"Space Vector Corp. · NASA Aerospace Battery Workshop (2016), slide 18",
    source:"https://www.nasa.gov/wp-content/uploads/2024/01/development-and-qualification-of-a-compact-rechargeable-li-ion-range-safety-battery.pdf",
    html:"<div class='bigeq'><span class='kicker'>NASA Aerospace Battery Workshop · 2016</span>A 0.73 kg battery pack, a 23.5 W heater,<br>and a chamber at −10 °C</div>",
    lead:"<p><b>Part 2: A battery.</b> Rockets carry a small battery whose one job is to power the system that destroys the rocket if it flies off course. It has to work in the cold, so it has its own heater. During testing, its engineers put one of these packs in a chamber held at $-10$ °C, switched on the 23.5 W heater, and left it on for two hours to see how hot the pack would get.</p><p>It is your spoon with the sign flipped: something cold, heading for a plateau.</p>" },

  { id:"b-fit",
    tool:"fitexp",
    checkKind:"expfit",
    slots:["batt"],
    preload:["batt"],
    attribution:"Space Vector Corp. · NASA Aerospace Battery Workshop (2016), slide 18",
    source:"https://www.nasa.gov/wp-content/uploads/2024/01/development-and-qualification-of-a-compact-rechargeable-li-ion-range-safety-battery.pdf",
    lead:"<p><b>Fit it.</b> These are the engineers' eleven readings: the pack's temperature $T$ against time, in minutes. With <b>Fit Exponential</b>, drag across all of them. This time nothing is pinned: the fit finds the plateau as well as $\\tau$. Read both off the fitted function, each to 1 decimal place.</p>",
    feedback:"A plateau a little under 50 °C, and a time constant of about a quarter of an hour.",
    feedbackWhen:{"fit": "Drag a window across all eleven points with <b>Fit Exponential</b> first; the fitted function appears in the readout.", "check": "{label} doesn't match the function on screen. {hint}", "empty": "Two boxes: the plateau (the first number in the fitted function) and $\\tau$ (the number under $t$).", "dp": "One decimal place for each.", "low": "{label} is low for this pack. Does your window cover all eleven points?", "high": "{label} is high for this pack. Does your window cover all eleven points?"},
    inputs:[
      {label:"plateau temperature", key:"b_T", unit:"°C", range:[30, 70], dp:1},
      {label:"battery's $\\tau$", key:"b_tau", unit:"min", range:[5, 40], dp:1} ] },

  { id:"b-passed",
    checkKind:"calc",
    slots:["batt"],
    lead:"<p><b>The heat passed per kelvin.</b> At the plateau the pack's temperature has stopped changing, so all 23.5 W from the heater is leaking out to the chamber. The chamber is at $-10$ °C. How many watts leak for each kelvin the pack sits above the chamber? Two decimal places.</p>",
    feedback:"About 0.4 W for every kelvin of difference. That is the bottom of the fraction.",
    feedbackWhen:{"empty": "One box: 23.5 W divided by how far the plateau sits above the chamber.", "dp": "Two decimal places.", "check": "Not quite. {hint} With your plateau, it comes to {expected} W/K."},
    input:"heat passed per kelvin", key:"b_G", unit:"W/K", range:[0.1, 2], dp:2 },

  { id:"b-stored",
    checkKind:"calc",
    slots:["batt"],
    lead:"<p><b>The heat stored per kelvin.</b> $\\tau$ = (heat stored per kelvin)/(heat passed per kelvin), and you now have $\\tau$ and the bottom. Find the top, in joules per kelvin, to the nearest whole number.</p>",
    feedback:"About 400 J for every kelvin. You just measured how much heat a battery pack holds, from a temperature log and the heater's wattage.",
    feedbackWhen:{"empty": "One box: $\\tau$ times the heat passed per kelvin. Mind the units of $\\tau$.", "dp": "A whole number of J/K, <b>no decimals</b>.", "low": "{label} is too small. A watt is a joule per second, and your $\\tau$ is in minutes.", "check": "Not quite. {hint} With your numbers, it comes to {expected} J/K."},
    input:"heat stored per kelvin", key:"b_C", unit:"J/K", range:[50, 2000], dp:0 },

  { id:"b-check",
    slots:["batt"],
    lead:"<p><b>A second way to the same number.</b> In the first two minutes the pack is still as cold as the chamber, so almost nothing leaks: all 23.5 W goes into warming it. The log says it warmed from $-10$ °C to $-3$ °C in those 120 seconds. From that alone, what is the heat stored per kelvin? Nearest whole number.</p>",
    feedback:"About 400 J/K again. Two routes, one answer: the plateau and $\\tau$ on one side, the very first slope on the other.",
    feedbackWhen:{"empty": "One box: the heat that went in (23.5 W for 120 s) divided by the temperature rise.", "dp": "A whole number of J/K, <b>no decimals</b>.", "low": "{label} is too small. Heat in is 23.5 W × 120 s; the rise is from $-10$ °C to $-3$ °C.", "high": "{label} is too large. Heat in is 23.5 W × 120 s; the rise is from $-10$ °C to $-3$ °C."},
    input:"heat stored per kelvin, from the first two minutes", key:"b_C2", unit:"J/K", range:[380, 430], dp:0 },

  { id:"b-fan",
    slots:["batt"],
    lead:"",
    check:"Suppose the chamber had a fan blowing across the pack, heater still at 23.5 W. Compared with this run, the pack's plateau and its $\\tau$ would be…",
    choices:["Higher plateau, longer $\\tau$", "The same plateau, shorter $\\tau$", "Lower plateau, shorter $\\tau$: more heat passed per kelvin, the same heat stored", "Lower plateau, the same $\\tau$"],
    answer:2,
    feedback:"Right, and it is your first spoon test. More heat passed per kelvin shortens $\\tau$, as blowing did. It also lowers the plateau, because 23.5 W now leaks out at a smaller temperature difference.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Which spoon test was this? Then: at the plateau, 23.5 W leaks out. If each kelvin of difference now leaks more, how many kelvins does it take?"} },

  { id:"g-intro",
    top:"html",
    attribution:"NOAA National Centers for Environmental Information · U.S. Climate Reference Network",
    source:"https://www.ncei.noaa.gov/pub/data/uscrn/products/hourly02/2024/CRNH0203-2024-NC_Asheville_13_S.txt",
    html:"<div class='bigeq'><span class='kicker'>NOAA Climate Reference Network · Asheville, North Carolina · 2024</span>Thermometers buried<br>5, 10 and 100 cm underground</div>",
    lead:"<p><b>Part 3: The ground.</b> The Sun heats the ground every day and cools it every night, and warms it every summer and cools it every winter. NOAA keeps thermometers buried at a weather station south of Asheville and logs them every hour.</p><p>The spoon and the battery were small enough to warm all at once. The ground isn't: heat has to soak down into it. In Class P, soaking in a distance $\\ell$ took a time $\\tau\\sim\\ell^2/D$.</p>" },

  { id:"g-compare",
