      const keep=(d,s)=>ok(d,s)?Math.round(100*d/s)+"%":"—", late=(l,T)=>Number.isFinite(l)?Math.round(100*l/T)+"%":"—", d=v=>Number.isFinite(v)?v.toFixed(1):"—";
      const row=(name,depth,k,l,of,D)=>"<li><b>"+name+"</b>, "+depth+" deeper: <b>"+k+"</b> of the swing is left, the peak comes <b>"+l+"</b> of a "+of+" late, and $D\\sim$ <b>"+D+"</b> $\\times10^{-7}$ m²/s</li>";
      return "<p>Your two waves, side by side:</p><ul>"+row("The day","5 cm",keep(a.g_d10,a.g_d5),late(a.g_dlag,24),"day",d(a.g_Dd))+row("The year","95 cm",keep(a.g_y100,a.g_y5),late(a.g_ylag,366),"year",d(a.g_Dy))+"</ul>"
        +"<p>The two rows should look alike, and the same soil gives about the same $D$ either way.</p>";
    })(a)+"<p><b>Two depths, same relative fade.</b> From 5 to 10 cm depth, the daily swing shrank by about the same fraction that the yearly swing shrank from 5 to 100 cm depth. So the heat diffused about 19 times deeper over 366 days than it diffused over 1 day.</p>"),
    check:"What mathematical truth best explains these results:",
    choices:["Diffusion depth grows with diffusivity: $D_\\text{year}/D_\\text{day}=19$.", "$\\frac{19}{366}\\cdot 366=19$.", "$\\sqrt{366}\\approx 19$", "$\\sqrt{366-19}\\approx 19$.", "$366\\cdot\\frac{2}{24}\\cdot 60\\%\\approx 19$"],
    answer:2,
    feedback:"Right. $\\tau\\sim\\ell^2/D$ read backward: in a time $\\tau$, heat soaks in a distance $\\ell\\sim\\sqrt{D\\tau}$. To go 19 times deeper, wait 366 times longer.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Class P: $\\tau\\sim\\ell^2/D$. Solve it for $\\ell$. If $\\tau$ gets 366 times bigger, what does $\\ell$ do?"} },

  { id:"model",
    top:"html",
    html:"<div class='bigeq'><span class='kicker'>Part 3 · Newton's Cooling/Heating</span>$\\displaystyle T-T_\\text{end}=(T_0-T_\\text{end})\\,e^{-t/\\tau}$</div>",
    lead:"<p>Anything that isn't yet at the temperature it's heading for, $T_\\text{end}$, closes the gap exponentially. The time constant is $\\tau=\\dfrac{\\text{heat stored per kelvin}}{\\text{heat passed per kelvin}}$: how much heat it takes to change the object's temperature by one kelvin, divided by how much heat crosses to the surroundings each second for every kelvin of difference.</p>",
    check:"For a mug of coffee on a desk, $T_\\text{end}$ is the room's temperature. Suppose two mugs of hot coffee sit cooling on a desk. They're the same except that one has twice as much coffee. How does its $\\tau$ roughly compare to the mug with less coffee?",
    choices:["It's half as big", "It's the same", "It's twice as big", "It's four times as big"],
    answer:2,
    feedback:"Right. Twice the heat stored per kelvin, leaking through the same wall, so twice the $\\tau$.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> Which part of the fraction changes when there is more coffee: the heat stored per kelvin, or the heat the wall passes per kelvin?"} },

  { id:"b-warmer",

    lead:"<p>Now put the mug on a mug warmer, in a cold room. The warmer puts in a steady number of watts; the mug leaks heat to the room, more the hotter it gets.</p>",
    check:"Where does the coffee's temperature end up?",
    choices:["At the room's temperature, as before", "At the warmer's temperature", "In between: warmer than the room, at the temperature where the warmer's watts in equal the watts leaking out to the room", "It keeps rising as long as the warmer is on"],
    answer:2,
    feedback:"Right. Once watts in equal watts out, nothing is stored, so the temperature stops changing. That is the coffee's new $T_\\text{end}$, and it closes the gap to it exponentially, just as before: it behaves as if it sat in a room that warm. The battery is the same story.",
    feedbackWhen:{"wrong": "<b>Discuss for a minute.</b> The temperature stops changing when no heat is being stored. When is that: when does the heat leaking out each second match the warmer's watts?"} },
